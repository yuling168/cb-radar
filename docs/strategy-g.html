<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略 G-v1｜CB Radar</title><style>:root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:40px 16px 64px}a{color:var(--green)}p{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}select{min-height:42px;padding:8px;width:220px;font:inherit}.state{padding:12px 0}.unavailable{border-left:4px solid #a5782b;padding:10px;margin:8px 0;background:#fffaf0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted)}.conditions{min-width:280px}@media(max-width:700px){.page{padding:24px 12px}table{min-width:1280px}}</style>
</head><body><main class="page"><nav><a href="index.html">← 每日行情</a>　<a href="strategy-a.html">策略 A-v1</a>　<a href="strategy-b.html">策略 B-v1</a>　<a href="strategy-c.html">策略 C-v1</a></nav><h1>策略 G-v1</h1><p>時間發動策略：顯示已保存的 G1／G2／G3 事件與量價窗口快照，不在瀏覽器重新計算。</p><section class="panel"><label>交易日期　<select id="dateSelect"></select></label><p id="summary" class="state">載入中…</p><div id="signals"></div><h2>資料不足、無法評估</h2><div id="unavailable"></div></section></main><script>
const $=s=>document.querySelector(s),nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});let signals=[],evaluations=[],selected="";
const labels={converted_ratio_below_10_pct:"已轉換比例低於 10%",conversion_value_at_least_90:"轉換價值至少 90",close_price_at_most_130:"收盤價不高於 130",g1_first_effective_trade_date_after_issue_anniversary:"G1 發行滿一年",g2_after_put_date:"G2 已過賣回日",g2_close_strictly_above_prior_19_high:"G2 收盤嚴格高於前 19 日高點",g2_volume_above_prior_5_average_times_3:"G2 今日量高於前 5 日均量 3 倍",g3_first_effective_trade_date_in_maturity_final_year:"G3 到期前一年"};
function conditions(row){return Object.entries(row.condition_results||{}).map(([k,v])=>`${v?"✓":"✗"} ${labels[k]||k}`).join("；")}function dates(values){return values&&values.length?values.join("、"):"—"}
function render(){const hit=signals.filter(r=>r.trade_date===selected),bad=evaluations.filter(r=>r.trade_date===selected&&r.data_status==="UNAVAILABLE");$("#signals").replaceChildren();$("#unavailable").replaceChildren();$("#summary").textContent=hit.length?`${selected}：${hit.length} 檔符合策略 G-v1。`:`${selected}：沒有符合策略 G-v1 的訊號。`;if(hit.length){const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.innerHTML="<thead><tr><th>CB</th><th>觸發類型</th><th>基本條件</th><th>事件日期</th><th>突破數值</th><th>轉換／餘額</th><th>完整條件</th></tr></thead>";const body=document.createElement("tbody");hit.sort((a,b)=>a.cb_code.localeCompare(b.cb_code)).forEach(r=>{const v=r.condition_values||{},tr=document.createElement("tr"),events=`發行日：${v.issue_date||"—"}\n滿一年：${v.issue_anniversary_date||"—"}\n賣回日：${v.put_date||"—"}\n到期日前一年：${v.maturity_final_year_start_date||"—"}\n到期日：${v.maturity_date||"—"}`,breakout=`收盤：${nf.format(v.close_price)}\n當日量：${nf.format(v.today_volume_lots)} 張\n前 19 日高點：${nf.format(v.prior_19_high_close_price)}\n前 5 日均量：${nf.format(v.prior_5_average_volume_lots)} 張\n前 19 日：${dates(v.prior_19_trade_dates)}\n前 5 日：${dates(v.prior_5_trade_dates)}`,basic=`轉換價值：${nf.format(v.conversion_value)}\n已轉換比例：${nf.format(v.converted_ratio_pct)}%\n收盤：${nf.format(v.close_price)}`;[`${r.cb_name||"—"}（${r.cb_code}）`,(v.trigger_types||[]).join("／")||"—",basic,events,breakout,`轉換價：${nf.format(v.conversion_price)}\n餘額日期：${v.balance_date||"—"}`,conditions(r)].forEach((x,i)=>{const td=document.createElement("td");td.textContent=x;if(i===6)td.className="conditions";tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);$("#signals").append(wrap)}if(bad.length){const n=document.createElement("div");n.className="unavailable";const total=bad.reduce((sum,row)=>sum+row.evaluation_count,0),reasons=new Map();bad.forEach(row=>reasons.set(row.unavailable_reason,(reasons.get(row.unavailable_reason)||0)+row.evaluation_count));n.textContent=`共 ${total} 檔資料不足、無法評估：${[...reasons.entries()].map(([reason,count])=>`${reason}（${count}）`).join("、")}`;$("#unavailable").append(n)}else $("#unavailable").textContent="本日沒有資料不足的評估結果。"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{signals=Array.isArray(p.strategy_g_signals)?p.strategy_g_signals:[];evaluations=Array.isArray(p.strategy_g_evaluations)?p.strategy_g_evaluations:[];const dates=[...new Set([...signals,...evaluations].map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("尚無策略 G-v1 已保存的評估資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));selected=dates[0];render()}).catch(e=>$("#summary").textContent=e.message);$("#dateSelect").addEventListener("change",e=>{selected=e.target.value;render()});
</script></body></html>
