<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CB Radar｜法人籌碼</title>
  <style>
    :root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#18804b;--red:#bd3131;--gold:#a5782b}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1680px;min-height:100vh;margin:auto;padding:38px 16px 16px;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{margin:0 0 8px;color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:.15em}h1{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(2rem,5vw,3.35rem)}.subtitle{color:var(--muted);line-height:1.65}.back{color:var(--green);font-weight:700;text-decoration:none}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 34px #19352712;margin-top:22px;flex:1;min-height:0;display:flex;flex-direction:column}.controls{display:grid;grid-template-columns:190px 1fr;gap:14px;padding:18px;background:#fbfcfa;border-bottom:1px solid var(--line)}label{display:grid;gap:6px;color:var(--muted);font-size:.78rem;font-weight:700}select,input{min-height:44px;border:1px solid #cbd7cf;border-radius:9px;padding:9px 11px;background:#fff;font:inherit}.result{display:flex;justify-content:space-between;gap:12px;padding:13px 18px;color:var(--muted);font-size:.85rem}.badge{padding:3px 8px;border-radius:999px;background:#e7f1eb;color:var(--green);font-weight:700}.badge.incomplete{background:#fff1ed;color:#9c3d29}.table-wrap{overflow:auto;flex:1;min-height:0}table{width:100%;min-width:1780px;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid #edf1ee;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f6f9f6;color:#4e5c54;font-size:.77rem;z-index:1}th:first-child{left:0;z-index:3;background:#f6f9f6}td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}th button{border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-align:left;cursor:pointer;padding:0}th button:hover,th button:focus-visible{color:var(--red)}.sort-mark{color:var(--gold);display:inline-block;width:1em}td{font-size:.88rem;font-variant-numeric:tabular-nums}.identity{font-weight:700}.sub{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.positive{color:var(--red)}.negative{color:var(--green)}.neutral,.unavailable{color:var(--muted)}.cards{display:none}.flow-card{border-top:1px solid var(--line);padding:16px}.flow-card h2{font-size:1rem;margin:0 0 4px}.meta{color:var(--muted);font-size:.83rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px}.metric{padding:11px 8px;border-top:1px solid #edf1ee}.metric:nth-child(odd){padding-left:0}.metric-label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}.state{padding:42px;text-align:center;color:var(--muted)}@media(max-width:768px){.page{padding:24px 12px 16px;display:block}header{display:block}.controls{grid-template-columns:1fr;padding:14px}.result{align-items:start;flex-direction:column}.table-wrap{display:none}.cards{display:block}.grid{grid-template-columns:1fr}.metric{padding-left:0}.flow-card{padding:15px}}
  </style>
</head>
<body><main class="page">
  <header><div><p class="eyebrow">TAIWAN CONVERTIBLE BONDS</p><h1>法人籌碼</h1><p class="subtitle">現行 CB 對應母股的外資、投信與已追蹤主動式 ETF 持股增減。ETF 不代表全市場 ETF 買賣超。</p></div><a class="back" href="index.html">← 每日行情</a></header>
  <section class="panel"><div class="controls"><label>資料日期<select id="dateSelect"></select></label><label>搜尋 CB 名稱／代號<input id="cbSearch" type="search" placeholder="例如：台泥、11011"></label></div><div class="result"><strong id="count">載入中…</strong><span id="info">準備資料</span></div><div class="table-wrap"><table><thead><tr><th aria-sort="none"><button data-sort="cb_name">CB <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="foreign_net_lots">外資當日<br>張／成交量% <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="trust_net_lots">投信當日<br>張／成交量% <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="foreign_streak_days">外資連買／賣 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="trust_streak_days">投信連買／賣 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="foreign_streak_lots">外資連續累計 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="trust_streak_lots">投信連續累計 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="active_etf_change_lots">已追蹤主動式 ETF<br>增減張／市值估算 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="active_etf_streak_days">ETF 連續增／減 <span class="sort-mark"></span></button></th><th aria-sort="none"><button data-sort="active_etf_streak_lots">ETF 連續累計 <span class="sort-mark"></span></button></th></tr></thead><tbody id="body"><tr><td class="state" colspan="10">資料載入中…</td></tr></tbody></table></div><div class="cards" id="cards"></div></section>
</main><script>
const state={rows:[],date:"",cb:"",sortKey:"cb_name",sortDirection:"asc"};const $=s=>document.querySelector(s);const nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});const lotsFormat=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:0});
const signed=(n,suffix="")=>n===null||n===undefined?"—":`${n>0?"+":""}${nf.format(n)}${suffix}`;
const signedLots=n=>{if(n===null||n===undefined)return "—";const rounded=Math.sign(n)*Math.round(Math.abs(n)+Number.EPSILON);return `${rounded>0?"+":""}${lotsFormat.format(rounded)} 張`};
const cls=n=>n>0?"positive":n<0?"negative":"neutral";
function unavailable(r,key){if(r[key+"_status"]!=="UNAVAILABLE")return null;return r.institutional_reason==="資料未提供（創新板）"?"資料未提供（創新板）":"資料未提供"}
function daily(r,key){const no=unavailable(r,key);if(no)return no;return `${signedLots(r[key+"_net_lots"])} / ${signed(r[key+"_volume_pct"],"%")}`}
function direction(days,lots,wordUp,wordDown){if(days===null||days===undefined)return `<span class="neutral">資料未提供</span>`;if(days===0)return `<span class="neutral">0 日（中斷）</span>`;return `<span class="${cls(lots)}">${lots>0?wordUp:wordDown} ${nf.format(days)} 日</span>`}
function etfDaily(r){if(r.active_etf_status==="UNAVAILABLE")return "資料未提供";return `${signedLots(r.active_etf_change_lots)} / ${signed(r.active_etf_change_value_twd/10000," 萬元")}`}
function value(r,key,fn){const v=fn();return `<span class="${cls(r[key])}">${v}</span>`}
function sortValue(r,key){if(key==="cb_name")return `${r.cb_name} ${r.cb_code}`;if(key.startsWith("foreign_")&&r.foreign_status==="UNAVAILABLE")return null;if(key.startsWith("trust_")&&r.trust_status==="UNAVAILABLE")return null;if(key.startsWith("active_etf_")&&r.active_etf_status==="UNAVAILABLE")return null;return r[key]}
function compareRows(a,b){const av=sortValue(a,state.sortKey),bv=sortValue(b,state.sortKey);if(av===null||av===undefined)return bv===null||bv===undefined?0:1;if(bv===null||bv===undefined)return -1;const result=typeof av==="number"?av-bv:String(av).localeCompare(String(bv),"zh-Hant",{numeric:true,sensitivity:"base"});return state.sortDirection==="asc"?result:-result}
function visible(){const q=s=>s.trim().toLocaleLowerCase("zh-Hant");const cb=q(state.cb);return state.rows.filter(r=>r.trade_date===state.date&&(!cb||`${r.cb_code} ${r.cb_name}`.toLocaleLowerCase("zh-Hant").includes(cb))).sort(compareRows);}
function desktop(r){return `<tr><td class="identity">${r.cb_name}<span class="sub">${r.cb_code}</span></td><td>${value(r,"foreign_net_lots",()=>daily(r,"foreign"))}</td><td>${value(r,"trust_net_lots",()=>daily(r,"trust"))}</td><td>${direction(r.foreign_streak_days,r.foreign_streak_lots,"連買","連賣")}</td><td>${direction(r.trust_streak_days,r.trust_streak_lots,"連買","連賣")}</td><td>${value(r,"foreign_streak_lots",()=>signedLots(r.foreign_streak_lots))}</td><td>${value(r,"trust_streak_lots",()=>signedLots(r.trust_streak_lots))}</td><td>${value(r,"active_etf_change_lots",()=>etfDaily(r))}</td><td>${direction(r.active_etf_streak_days,r.active_etf_streak_lots,"連續增持","連續減持")}</td><td>${value(r,"active_etf_streak_lots",()=>r.active_etf_status==="UNAVAILABLE"?"資料未提供":signedLots(r.active_etf_streak_lots))}</td></tr>`}
function metric(label,html){return `<div class="metric"><span class="metric-label">${label}</span>${html}</div>`}
function card(r){return `<article class="flow-card"><h2>${r.cb_name} · ${r.cb_code}</h2><div class="meta">母股：${r.parent_stock_name}（${r.parent_stock_code}）</div><div class="grid">${metric("外資當日",value(r,"foreign_net_lots",()=>daily(r,"foreign")))}${metric("投信當日",value(r,"trust_net_lots",()=>daily(r,"trust")))}${metric("外資連買／賣",direction(r.foreign_streak_days,r.foreign_streak_lots,"連買","連賣"))}${metric("投信連買／賣",direction(r.trust_streak_days,r.trust_streak_lots,"連買","連賣"))}${metric("外資連續累計",value(r,"foreign_streak_lots",()=>signedLots(r.foreign_streak_lots)))}${metric("投信連續累計",value(r,"trust_streak_lots",()=>signedLots(r.trust_streak_lots)))}${metric("已追蹤主動式 ETF",value(r,"active_etf_change_lots",()=>etfDaily(r)))}${metric("ETF 連續增／減",direction(r.active_etf_streak_days,r.active_etf_streak_lots,"連續增持","連續減持"))}${metric("ETF 連續累計",value(r,"active_etf_streak_lots",()=>r.active_etf_status==="UNAVAILABLE"?"資料未提供":signedLots(r.active_etf_streak_lots)))}</div></article>`}
function updateSortHeaders(){document.querySelectorAll("th[aria-sort]").forEach(th=>{const button=th.querySelector("button"),active=button.dataset.sort===state.sortKey;th.setAttribute("aria-sort",active?(state.sortDirection==="asc"?"ascending":"descending"):"none");button.querySelector(".sort-mark").textContent=active?(state.sortDirection==="asc"?"▲":"▼"):""})}
function render(){updateSortHeaders();const rows=visible();$("#count").textContent=`共 ${nf.format(rows.length)} 筆現行 CB`;$("#body").innerHTML=rows.length?rows.map(desktop).join(""):`<tr><td class="state" colspan="10">沒有符合條件的現行 CB</td></tr>`;$("#cards").innerHTML=rows.length?rows.map(card).join(""):`<div class="state">沒有符合條件的現行 CB</div>`;const coverage=rows[0]?.active_etf_coverage||"incomplete";$("#info").innerHTML=`${state.date} · 已追蹤主動式 ETF coverage <span class="badge ${coverage}">${coverage}</span>`}
document.querySelectorAll("button[data-sort]").forEach(button=>button.addEventListener("click",()=>{const key=button.dataset.sort;state.sortDirection=state.sortKey===key&&state.sortDirection==="asc"?"desc":"asc";state.sortKey=key;render()}));fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{if(!Array.isArray(p.institutional_records))throw Error("法人籌碼資料格式不正確");state.rows=p.institutional_records;const dates=[...new Set(state.rows.map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("沒有可用法人籌碼資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));state.date=dates[0];render()}).catch(e=>{$("#count").textContent="載入失敗";$("#info").textContent=e.message});$("#dateSelect").addEventListener("change",e=>{state.date=e.target.value;render()});$("#cbSearch").addEventListener("input",e=>{state.cb=e.target.value;render()});
</script></body></html>
