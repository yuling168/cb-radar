<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CB Radar｜今日策略雷達</title><style>
:root{--i:#17211b;--m:#637068;--l:#dce4de;--p:#f4f7f3;--c:#fff;--g:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:28px 16px 56px}nav{display:flex;flex-wrap:wrap;gap:8px 16px;border-bottom:1px solid var(--l);padding-bottom:14px}a{color:var(--g);text-decoration:none;font-weight:700}h1{font-size:clamp(2rem,5vw,3.4rem);margin:26px 0 6px}.muted{color:var(--m)}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.date,.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f1eb;color:var(--g);font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.section{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}.metric{display:block;color:var(--g);font-size:2rem;font-weight:800;margin-top:8px}.section{margin-top:16px}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.list{display:grid;gap:9px}.item{border-left:4px solid var(--g);background:#f8fbf8;padding:11px}.tag{font-size:.78rem;margin:3px}.strategy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.strategy-grid a{border:1px solid var(--l);border-radius:12px;padding:14px;background:#fff}.strategy-grid small{display:block;color:var(--m);font-weight:400;margin-top:5px}@media(max-width:760px){.page{padding:18px 12px 40px}.hero{display:block}.date{margin-top:12px}.grid{grid-template-columns:repeat(2,1fr)}.two,.strategy-grid{grid-template-columns:1fr}nav{gap:8px 12px}.card,.section{padding:14px}}
</style></head><body><main class="page">
<nav aria-label="全站導覽"><a href="index.html">首頁</a><a href="institutional.html">法人籌碼</a><a href="strategy-a.html">成交量10日新高</a><a href="strategy-b.html">CB突破轉換價</a><a href="strategy-c.html">CB資優生</a><a href="strategy-g.html">時間發動</a><a href="daily-market.html">每日行情</a></nav>
<header class="hero"><div><p class="muted">TAIWAN CONVERTIBLE BONDS</p><h1>CB Radar｜今日策略雷達</h1><p class="muted">快速看今天有哪些值得注意的 CB；訊號均讀取已保存快照。</p></div><div id="date" class="date">資料載入中…</div></header>
<section class="grid"><div class="card">今日新觸發<strong id="signalCount" class="metric">—</strong></div><div class="card">時間發動提醒<strong id="gCount" class="metric">—</strong></div><div class="card">法人 / ETF 同步看好<strong id="flowCount" class="metric">—</strong></div><div class="card">今日可查 CB<strong id="recordCount" class="metric">—</strong></div></section>
<section class="two"><div class="section"><h2>今日新觸發標的</h2><div id="signals" class="list"></div></div><div class="section"><h2>時間發動提醒</h2><div id="gSignals" class="list"></div></div></section>
<section class="section"><h2>策略總覽</h2><div class="strategy-grid"><a href="strategy-a.html">成交量10日新高<small>成交量嚴格突破的已保存訊號</small></a><a href="strategy-b.html">CB突破轉換價<small>以價格、量能與轉換價值篩選</small></a><a href="strategy-c.html">CB資優生<small>依轉換價值區間挑選溢價率前二名</small></a><a href="strategy-g.html">時間發動<small>依已保存的生命週期事件提醒</small></a></div></section>
<section class="section"><h2>重要公告與新聞</h2><div id="announcements" class="list"></div></section>
</main><script>
const $=s=>document.querySelector(s),names={A:"成交量10日新高",B:"CB突破轉換價",C:"CB資優生",G:"時間發動"},gl={G1:"G 發行滿一年",G2:"G 賣回日後",G3:"G 到期前一年"},nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});
function list(el,rows,empty){el.innerHTML=rows.length?rows.map(r=>{const v=r.condition_values||{},t=(v.trigger_types||[]).map(x=>`<span class="tag">${gl[x]||x}</span>`).join("");return `<div class="item"><strong>${names[r.strategy_code]||r.strategy_code}｜${r.cb_name||"—"}（${r.cb_code}）</strong><br>${t}${v.conversion_value!=null?`轉換價值 ${nf.format(v.conversion_value)}　`:""}${v.premium_rate_pct!=null?`溢價率 ${nf.format(v.premium_rate_pct)}%`:""}</div>`}).join(""):`<div class="muted">${empty}</div>`}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{const rs=p.records||[],ss=p.strategy_signals||[],fs=p.institutional_records||[],as=p.announcements||[],d=[...new Set(rs.map(r=>r.trade_date))].sort().reverse()[0],today=ss.filter(r=>r.trade_date===d),gs=today.filter(r=>r.strategy_code==="G"),good=fs.filter(r=>r.trade_date===d&&r.foreign_net_lots>0&&r.trust_net_lots>0&&r.active_etf_change_lots>0);$("#date").textContent=`資料日期：${d||"—"}`;$("#signalCount").textContent=today.length;$("#gCount").textContent=gs.length;$("#flowCount").textContent=good.length;$("#recordCount").textContent=rs.filter(r=>r.trade_date===d).length;list($("#signals"),today,"本日沒有新觸發訊號。");list($("#gSignals"),gs,"本日沒有時間發動提醒。");$("#announcements").innerHTML=as.length?as.map(a=>`<div class="item"><strong>${a.company_name||a.company_code||"—"}</strong>　${a.subject||"公告"}<br><span class="muted">${a.announcement_date||""}</span></div>`).join(""):`<div class="muted">目前沒有可直接呈現的重要公告資料。</div>`}).catch(e=>$("#date").textContent=`資料載入失敗：${e.message}`)
</script></body></html>
