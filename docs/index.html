<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CB策略雷達</title><style>
:root{--i:#17211b;--m:#637068;--l:#dce4de;--p:#f4f7f3;--c:#fff;--g:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:28px 16px 56px}nav{display:flex;flex-wrap:wrap;gap:8px 16px;border-bottom:1px solid var(--l);padding-bottom:14px}a{color:var(--g);text-decoration:none;font-weight:700}h1{font-size:clamp(2rem,5vw,3.4rem);margin:26px 0 6px}.muted{color:var(--m)}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.date,.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f1eb;color:var(--g);font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.card,.section{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}.grid .card{padding:10px 14px;line-height:1.35}.metric{display:block;color:var(--g);font-size:2rem;font-weight:800;line-height:1.08;margin-top:3px}.section{margin-top:16px}.tag{font-size:.78rem;margin:3px}.table-wrap{overflow-x:auto;max-width:100%}table{width:100%;min-width:920px;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top;font-size:.9rem}th{color:var(--m);font-size:.8rem;white-space:nowrap}.identity{font-weight:800}.cb-name{display:block;font-size:1rem}.strategy-name,.cell-meta{display:block;color:var(--m);font-size:.8rem;margin-top:3px;font-weight:400}.notice{border-left:4px solid var(--g);background:#f8fbf8;padding:11px;margin-top:8px}.list{display:grid;gap:9px}@media(max-width:760px){.page{padding:18px 12px 40px}.hero{display:block}.date{margin-top:12px}.grid{grid-template-columns:1fr}.card,.section{padding:14px}.grid .card{padding:10px 14px}.table-wrap{margin:0 -14px;padding:0 14px;width:calc(100% + 28px)}}
</style></head><body><main class="page">
<nav aria-label="全站導覽"><a href="index.html">首頁</a><a href="institutional.html">法人籌碼</a><a href="strategy-a.html">成交量10日新高</a><a href="strategy-b.html">CB突破轉換價</a><a href="strategy-c.html">CB資優生</a><a href="strategy-g.html">時間發動</a><a href="daily-market.html">每日行情</a></nav>
<header class="hero"><div><h1>CB策略雷達</h1></div><div id="date" class="date">資料載入中…</div></header>
<section class="grid"><div class="card">今日新觸發<strong id="signalCount" class="metric">—</strong></div><div class="card">時間發動提醒<strong id="gCount" class="metric">—</strong></div><div class="card">法人 / ETF 同步看好<strong id="flowCount" class="metric">—</strong></div></section>
<section class="section"><h2>今日新觸發標的</h2><div class="table-wrap"><table><thead><tr><th>CB／策略</th><th>轉換價值／溢價率</th><th>現CB價格</th><th>到期／賣回</th><th>已轉換比率</th><th>當日CB量</th></tr></thead><tbody id="signals"></tbody></table></div></section>
<section class="section"><h2>重要公告與新聞</h2><p class="muted">僅列現行 CB 發行公司且主旨屬可轉債、籌資、資本、併購或重大營運／財務事件的已保存公告。</p><div id="announcements" class="list"></div></section>
</main><script>
const $=s=>document.querySelector(s),names={A:"成交量10日新高",B:"CB突破轉換價",C:"CB資優生",G:"時間發動"},gl={G1:"G 發行滿一年",G2:"G 賣回日後",G3:"G 到期前一年"},nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});
const blank="—",show=n=>n===null||n===undefined?blank:nf.format(n);
function nearerEvent(r,date){const dates=[{kind:"賣回",date:r.put_date},{kind:"到期",date:r.maturity_date}].filter(x=>x.date&&x.date>=date).sort((a,b)=>a.date.localeCompare(b.date));return dates.length?`${dates[0].kind} ${dates[0].date}`:blank}
function signalRow(signal,records,date){const v=signal.condition_values||{},r=records.get(`${date}|${signal.cb_code}`)||{},types=(v.trigger_types||[]).map(x=>`<span class="tag">${gl[x]||x}</span>`).join(""),converted=r.balance_ratio===null||r.balance_ratio===undefined?blank:`${show(100-r.balance_ratio)}%`;return `<tr><td class="identity"><span class="cb-name">${signal.cb_name||blank}（${signal.cb_code}）</span><span class="strategy-name">${names[signal.strategy_code]||signal.strategy_code}</span>${types}</td><td>轉換價值 ${show(v.conversion_value)}<span class="cell-meta">溢價率 ${v.premium_rate_pct===null||v.premium_rate_pct===undefined?blank:`${show(v.premium_rate_pct)}%`}</span></td><td>${show(r.close_price)}</td><td>${nearerEvent(r,date)}</td><td>${converted}</td><td>${r.volume_lots===null||r.volume_lots===undefined?blank:`${show(r.volume_lots)} 張`}</td></tr>`}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{const rs=p.records||[],ss=p.strategy_signals||[],fs=p.institutional_records||[],as=p.announcements||[],d=[...new Set(rs.map(r=>r.trade_date))].sort().reverse()[0],today=ss.filter(r=>r.trade_date===d),gs=today.filter(r=>r.strategy_code==="G"),good=fs.filter(r=>r.trade_date===d&&r.foreign_net_lots>0&&r.trust_net_lots>0&&r.active_etf_change_lots>0),records=new Map(rs.filter(r=>r.trade_date===d).map(r=>[`${d}|${r.cb_code}`,r]));$("#date").textContent=`資料日期：${d||blank}`;$("#signalCount").textContent=today.length;$("#gCount").textContent=gs.length;$("#flowCount").textContent=good.length;$("#signals").innerHTML=today.length?today.map(s=>signalRow(s,records,d)).join(""):`<tr><td colspan="6" class="muted">本日沒有新觸發訊號。</td></tr>`;$("#announcements").innerHTML=as.length?as.map(a=>`<div class="notice"><strong>${a.company_name||a.company_code||blank}</strong>　${a.subject||"公告"}<br><span class="muted">${a.announcement_date||""}</span></div>`).join(""):`<div class="notice muted">今日無重要 CB 相關訊息</div>`}).catch(e=>$("#date").textContent=`資料載入失敗：${e.message}`)
</script></body></html>
