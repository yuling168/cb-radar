<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CB策略雷達</title><style>
:root{--i:#17211b;--m:#637068;--l:#dce4de;--p:#f4f7f3;--c:#fff;--g:#185c42;--soft:#f8fbf8;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:28px 16px 56px}nav{display:flex;flex-wrap:wrap;gap:8px 16px;border-bottom:1px solid var(--l);padding-bottom:14px}a{color:var(--g);text-decoration:none;font-weight:700}h1{font-size:clamp(2rem,5vw,3.4rem);margin:26px 0 6px}.muted{color:var(--m)}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.date,.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#e7f1eb;color:var(--g);font-weight:700}.new-issue{color:var(--red);font-size:.82rem;margin-left:6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.card,.section{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}.grid .card{padding:10px 14px;line-height:1.35}.metric{display:block;color:var(--g);font-size:2rem;font-weight:800;line-height:1.08;margin-top:3px}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{margin:0}.sort-control{display:flex;align-items:center;gap:7px;color:var(--m);font-size:.84rem;font-weight:700}.sort-control select,.sort-control button{min-height:34px;border:1px solid #cbd7cf;border-radius:8px;background:#fff;color:var(--i);font:inherit;padding:5px 8px}.sort-control button{color:var(--g);font-weight:800;cursor:pointer}.signal-list{display:grid;gap:8px}.signal-card{display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid var(--l);border-radius:12px;background:var(--soft)}.signal-identity{min-width:178px}.cb-name{display:block;font-size:1rem;font-weight:800;white-space:nowrap}.strategy-name{display:block;color:var(--m);font-size:.8rem;margin-top:3px}.signal-facts{display:flex;flex:1;flex-wrap:wrap;gap:7px 16px;align-items:center}.fact{white-space:nowrap;font-size:.88rem}.fact b{color:var(--m);font-size:.76rem;margin-right:4px}.tag{font-size:.78rem;margin:2px 0}.notice{border-left:4px solid var(--g);background:#f8fbf8;padding:11px;margin-top:8px}.list{display:grid;gap:9px}@media(max-width:760px){.page{padding:18px 12px 40px}.hero{display:block}.date{margin-top:12px}.grid{grid-template-columns:1fr}.card,.section{padding:14px}.grid .card{padding:10px 14px}.section-head{align-items:flex-start;flex-direction:column}.signal-card{align-items:flex-start;flex-direction:column;gap:9px;padding:11px 12px}.signal-identity{min-width:0}.signal-facts{gap:6px 13px}.fact{font-size:.86rem}}
</style><link rel="stylesheet" href="site-shell.css"></head><body><main class="page">
<nav aria-label="全站導覽"><a href="index.html">首頁</a><a href="institutional.html">法人籌碼</a><a href="strategy-a.html">成交量10日新高</a><a href="strategy-b.html">CB突破轉換價</a><a href="strategy-c.html">CB資優生</a><a href="strategy-g.html">時間發動</a><a href="daily-market.html">每日行情</a></nav>
<header class="hero"><div><h1>CB策略雷達</h1></div><div id="date" class="date">資料載入中…</div></header>
<section class="grid"><div class="card">今日新觸發<strong id="signalCount" class="metric">—</strong></div><div class="card">時間發動提醒<strong id="gCount" class="metric">—</strong></div><div class="card">法人 / ETF 同步看好<strong id="flowCount" class="metric">—</strong></div></section>
<section class="section"><div class="section-head"><h2>今日新觸發標的</h2><div class="sort-control"><label for="sortKey">排序</label><select id="sortKey"><option value="">原始順序</option><option value="close_price">現CB價格</option><option value="conversion_value">轉換價值</option><option value="premium_rate_pct">溢價率</option><option value="converted_ratio_pct">已轉換比率</option><option value="volume_lots">當日CB量</option></select><button id="sortDirection" type="button" aria-label="切換排序方向" title="切換排序方向">▲</button></div></div><div id="signals" class="signal-list"></div></section>
<section class="section"><h2>重要公告與新聞</h2><p class="muted">僅列現行 CB 發行公司且主旨屬可轉債、籌資、資本、併購或重大營運／財務事件的已保存公告。</p><div id="announcements" class="list"></div></section>
</main><script>
const $=s=>document.querySelector(s),names={A:"成交量10日新高",B:"CB突破轉換價",C:"CB資優生",G:"時間發動"},gl={G1:"G 發行滿一年",G2:"G 賣回日後",G3:"G 到期前一年"},nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2}),whole=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:0});
const blank="—",show=n=>n===null||n===undefined?blank:nf.format(n);let sortKey="",sortDirection="asc";
function formatDate(value){if(!value)return "";const [year,month,day]=String(value).split("-");return `${year}/${Number(month)}/${Number(day)}`}
function nearerEventDate(r){const dates=[r.put_date,r.maturity_date].filter(Boolean).sort();return dates.length?formatDate(dates[0]):""}
function fact(label,value){return `<span class="fact"><b>${label}</b>${value}</span>`}
function signalCard(signal,records,date){const v=signal.condition_values||{},r=records.get(`${date}|${signal.cb_code}`)||{},types=(v.trigger_types||[]).map(x=>`<span class="tag">${gl[x]||x}</span>`).join(""),converted=r.balance_ratio===null||r.balance_ratio===undefined?blank:`${show(100-r.balance_ratio)}%`,volume=r.volume_lots===null||r.volume_lots===undefined?blank:`${whole.format(r.volume_lots)} 張`,eventDate=nearerEventDate(r),issued=r.issue_date&&Math.floor((Date.parse(`${date}T00:00:00Z`)-Date.parse(`${r.issue_date}T00:00:00Z`))/86400000)<30&&date>=r.issue_date?`<span class="new-issue">新發行 ${r.issue_date.replaceAll("-","/").replace(/\/(0\d)/g,"/$1").replace(/\/(\d{2})$/,(_,d)=>`/${Number(d)}`)}</span>`:"";return `<article class="signal-card"><div class="signal-identity"><span class="cb-name">${signal.cb_name||blank}（${signal.cb_code}）${issued}</span><span class="strategy-name">${names[signal.strategy_code]||signal.strategy_code}</span>${types}</div><div class="signal-facts">${fact("現價",show(r.close_price))}${fact("轉換價值",show(v.conversion_value))}${fact("溢價率",v.premium_rate_pct===null||v.premium_rate_pct===undefined?blank:`${show(v.premium_rate_pct)}%`)}${fact("已轉換",converted)}${fact("當日量",volume)}${eventDate?`<span class="fact">${eventDate}</span>`:""}</div></article>`}
function sortValue(signal,records,date,key){const values=signal.condition_values||{},record=records.get(`${date}|${signal.cb_code}`)||{};if(key==="converted_ratio_pct")return record.balance_ratio===null||record.balance_ratio===undefined?null:100-record.balance_ratio;return key in values?values[key]:record[key]}
function renderSignals(today,records,date){const rows=[...today];if(sortKey)rows.sort((a,b)=>{const av=sortValue(a,records,date,sortKey),bv=sortValue(b,records,date,sortKey);if(av===null||av===undefined)return bv===null||bv===undefined?0:1;if(bv===null||bv===undefined)return -1;return(sortDirection==="asc"?1:-1)*(av-bv)});$("#signals").innerHTML=rows.length?rows.map(s=>signalCard(s,records,date)).join(""):`<p class="muted">本日沒有新觸發訊號。</p>`;$("#sortDirection").textContent=sortDirection==="asc"?"▲":"▼"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{const rs=p.records||[],ss=p.strategy_signals||[],fs=p.institutional_records||[],as=p.announcements||[],d=[...new Set(rs.map(r=>r.trade_date))].sort().reverse()[0],today=ss.filter(r=>r.trade_date===d),gs=today.filter(r=>r.strategy_code==="G"),good=fs.filter(r=>r.trade_date===d&&r.foreign_net_lots>0&&r.trust_net_lots>0&&r.active_etf_change_lots>0),records=new Map(rs.filter(r=>r.trade_date===d).map(r=>[`${d}|${r.cb_code}`,r]));$("#date").textContent=`資料日期：${d||blank}`;$("#signalCount").textContent=today.length;$("#gCount").textContent=gs.length;$("#flowCount").textContent=good.length;renderSignals(today,records,d);$("#sortKey").addEventListener("change",e=>{sortKey=e.target.value;renderSignals(today,records,d)});$("#sortDirection").addEventListener("click",()=>{sortDirection=sortDirection==="asc"?"desc":"asc";renderSignals(today,records,d)});$("#announcements").innerHTML=as.length?as.map(a=>`<div class="notice"><strong>${a.company_name||a.company_code||blank}</strong>　${a.subject||"公告"}<br><span class="muted">${a.announcement_date||""}</span></div>`).join(""):`<div class="notice muted">今日無重要 CB 相關訊息</div>`}).catch(e=>$("#date").textContent=`資料載入失敗：${e.message}`)
</script></body></html>
