<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>策略 A-v1｜CB Radar</title>
  <style>
    :root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#185c42;--soft:#e7f1eb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:40px 16px 64px}a{color:var(--green)}h1{margin:0 0 8px}p{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}select{min-height:42px;padding:8px;width:220px;font:inherit}.state{padding:18px 0;color:var(--muted)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted)}.ok{color:var(--green);font-weight:700}.unavailable{border-left:4px solid #a5782b;padding:10px;margin:8px 0;background:#fffaf0}.conditions{font-size:.85rem;line-height:1.7}.table-wrap{overflow:auto}@media(max-width:700px){.page{padding:24px 12px}table{min-width:780px}}
  </style>
</head>
<body><main class="page">
  <nav><a href="index.html">← 每日行情</a>　<a href="institutional.html">法人籌碼</a></nav>
  <h1>策略 A-v1</h1><p>CB 成交量創 10 日新高。顯示已保存的策略快照，不在瀏覽器重新計算。</p>
  <section class="panel"><label>交易日期　<select id="dateSelect"></select></label><p id="summary" class="state">載入中…</p><div id="signals"></div><h2>資料不足、無法評估</h2><div id="unavailable"></div></section>
</main><script>
const $=s=>document.querySelector(s), nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});
let signals=[], evaluations=[], selected="";
const labels={volume_strictly_above_prior_9_max:"成交量嚴格高於前 9 日最高",close_price_in_115_to_150:"收盤價介於 115–150",close_price_above_conversion_value:"收盤價高於轉換價值",premium_rate_above_1_pct:"溢價率高於 1%",ten_day_volume_above_300_lots:"10 日累計量高於 300 張",volume_above_prior_5_average_times_3:"成交量高於前 5 日平均 3 倍"};
function conditions(row){return Object.entries(row.condition_results||{}).map(([k,v])=>`${v?"✓":"✗"} ${labels[k]||k}`).join("；")}function render(){const hit=signals.filter(r=>r.trade_date===selected), bad=evaluations.filter(r=>r.trade_date===selected&&r.data_status==="UNAVAILABLE");$("#signals").replaceChildren();$("#unavailable").replaceChildren();$("#summary").textContent=hit.length?`${selected}：${hit.length} 檔符合策略。`:`${selected}：沒有符合策略的訊號。`;if(hit.length){const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.innerHTML="<thead><tr><th>CB</th><th>收盤價</th><th>轉換價值</th><th>溢價率</th><th>今日成交量</th><th>完整條件</th></tr></thead>";const body=document.createElement("tbody");hit.forEach(r=>{const v=r.condition_values||{},tr=document.createElement("tr");[`${r.cb_name||"—"}（${r.cb_code}）`,nf.format(v.close_price),nf.format(v.conversion_value),`${nf.format(v.premium_rate_pct)}%`,`${nf.format(v.today_volume_lots)} 張`,conditions(r)].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);$("#signals").append(wrap)}if(bad.length){const n=document.createElement("div");n.className="unavailable";const total=bad.reduce((sum,row)=>sum+row.evaluation_count,0);n.textContent=`共 ${total} 檔資料不足、無法評估：${bad.map(row=>`${row.unavailable_reason}（${row.evaluation_count}）`).join("、")}`;$("#unavailable").append(n)}else $("#unavailable").textContent="本日沒有資料不足的評估結果。"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{signals=Array.isArray(p.strategy_a_signals)?p.strategy_a_signals:[];evaluations=Array.isArray(p.strategy_a_evaluations)?p.strategy_a_evaluations:[];const dates=[...new Set([...signals,...evaluations].map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("尚無策略 A-v1 已保存的評估資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));selected=dates[0];render()}).catch(e=>$("#summary").textContent=e.message);$("#dateSelect").addEventListener("change",e=>{selected=e.target.value;render()});
</script></body></html>
