<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="台灣可轉換公司債每日行情查詢">
  <title>CB Radar｜每日行情</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #637068;
      --line: #dce4de;
      --paper: #f4f7f3;
      --card: #ffffff;
      --green: #185c42;
      --green-soft: #e7f1eb;
      --gold: #a5782b;
      --shadow: 0 14px 38px rgba(25, 53, 39, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 8% 0%, rgba(165, 120, 43, 0.11), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 16px 64px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 22px 0 18px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(2rem, 5vw, 3.65rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    nav { display: flex; flex-wrap: wrap; gap: 8px 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    nav a { color: var(--green); font-weight: 700; text-decoration: none; }

    .source-badge {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid #c7d7cd;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .panel {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(190px, 0.7fr) minmax(260px, 1.3fr);
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfa;
    }

    #exportExcel {
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid #cbd7cf;
      border-radius: 10px;
      background: #fff;
      color: var(--green);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    #exportExcel:hover {
      background: var(--green-soft);
      border-color: var(--green);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    select, input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd7cf;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      outline: none;
      padding: 10px 12px;
    }

    select:focus, input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(24, 92, 66, 0.12);
    }

    .filter-collapse {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .filter-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: #fbfcfa;
      cursor: pointer;
      user-select: none;
      list-style: none;
      transition: background 0.15s ease;
    }

    .filter-toggle-bar::-webkit-details-marker {
      display: none;
    }

    .filter-toggle-bar:hover {
      background: #f2f7f4;
    }

    .filter-toggle-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .filter-toggle-arrow {
      display: inline-block;
      font-size: 0.72rem;
      color: var(--green);
      transition: transform 0.2s ease;
      line-height: 1;
    }

    .filter-collapse[open] .filter-toggle-arrow {
      transform: rotate(90deg);
    }

    .filter-toggle-title {
      font-weight: 800;
      color: var(--green);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    .filter-toggle-hint {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .filter-toggle-hint::before {
      content: "（點擊展開條件設定）";
    }

    .filter-collapse[open] .filter-toggle-hint::before {
      content: "（點擊收合條件設定）";
    }

    .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; padding: 14px 20px; border-top: 1px dashed var(--line); }
    .filters .range { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.78rem; font-weight: 700; }
    .filters .range input[type="date"] { width: 140px; }
    .filters .range input[type="date"].is-empty:not(:focus)::-webkit-datetime-edit { color: transparent; }
    .filters .range input { width: 84px; min-height: 36px; padding: 6px 8px; }
    .filters .range select { width: 90px; min-height: 36px; padding: 6px 8px; }
    .filters button { min-height: 36px; border: 1px solid #cbd7cf; border-radius: 10px; background: #fff; color: var(--green); font: inherit; font-weight: 800; padding: 6px 14px; cursor: pointer; }

    .result-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      max-height: min(70vh, 720px);
      overflow: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid var(--line);
    }

    table {
      width: 100%;
      min-width: 1900px;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #edf1ee;
      text-align: left;
      white-space: nowrap;
    }

    .sticky-name {
      position: sticky;
      left: 0;
      z-index: 2;
      min-width: 110px;
      max-width: 140px;
      white-space: nowrap;
      background: var(--card);
      box-shadow: 2px 0 0 var(--line);
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f6f9f6;
      color: #4e5c54;
      font-size: 0.77rem;
      letter-spacing: 0.03em;
    }

    th.sticky-name {
      z-index: 3;
      background: #f6f9f6;
    }

    tbody tr:hover .sticky-name { background: #fbfcfa; }

    th button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 0;
    }

    th button:hover, th button:focus-visible { color: var(--green); }
    .sort-mark { width: 1em; color: var(--gold); }
    td { font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    td.numeric { text-align: right; }
    tbody tr:hover { background: #fbfcfa; }
    .zero { color: var(--muted); }
    .cb-data-row { cursor: pointer; user-select: none; transition: background 0.12s ease; }
    .cb-data-row:hover { background: #f0f7f3 !important; }
    .cb-data-row.row-expanded { background: #eaf4ee !important; }
    .sticky-name-wrap { display: flex; align-items: center; gap: 6px; }
    .row-arrow { display: inline-block; font-size: 0.65rem; color: var(--green); width: 12px; text-align: center; }
    .tag-method { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 0.78rem; font-weight: 800; white-space: nowrap; }
    .method-auction { background: #e7f5ec; color: #15803d; border: 1px solid #bbf7d0; }
    .method-inquiry { background: #fdf2f8; color: #db2777; border: 1px solid #fbcfe8; }
    .auction-mini-link { color: var(--green); text-decoration: none; font-size: 0.82rem; font-weight: 800; margin-left: 3px; }
    .auction-mini-link:hover { text-decoration: underline; }
    .quick-view-row { background: #f8faf8; }
    .quick-view-td {
      padding: 0 16px 16px !important;
      border-bottom: 2px solid var(--line);
      overflow: visible;
    }
    .quick-view-card {
      position: sticky;
      left: 12px;
      width: calc(100vw - 40px);
      max-width: 660px;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid #dce4de;
      border-radius: 14px;
      padding: 16px 18px;
      margin-top: 6px;
      box-shadow: 0 4px 18px rgba(23, 33, 27, 0.08);
    }
    .quick-close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 26px;
      height: 26px;
      border: 1px solid #dce4de;
      border-radius: 50%;
      background: #f4f7f4;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      transition: all 0.15s ease;
      z-index: 2;
    }
    .quick-close-btn:hover {
      background: #e2ede5;
      color: var(--ink);
      border-color: #cbd7cf;
    }
    .quick-view-header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 12px;
      padding-right: 32px;
      border-bottom: 1px solid #edf1ee;
      margin-bottom: 10px;
    }
    .quick-view-title-group { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; }
    .quick-cb-title { font-size: 1.15rem; font-weight: 800; color: var(--ink); }
    .quick-cb-dates { font-size: 0.84rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
    .tag-remain { display: inline-block; padding: 2px 7px; border-radius: 6px; background: #eef2ff; color: #3b50df; font-size: 0.76rem; font-weight: 700; }
    .tag-secured { display: inline-block; padding: 2px 7px; border-radius: 6px; background: #fdf2f2; color: #d6324a; border: 1px solid #fecdd3; font-size: 0.76rem; font-weight: 700; }
    .tag-unsecured { display: inline-block; padding: 2px 7px; border-radius: 6px; background: #f3f4f6; color: #17211b; border: 1px solid #e5e7eb; font-size: 0.76rem; font-weight: 700; }
    .quick-view-price-box { text-align: right; flex-shrink: 0; }
    .quick-price { font-size: 1.25rem; font-weight: 800; color: var(--ink); line-height: 1.15; }
    .quick-conv { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .detail-grid { display: grid; gap: 2px; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px dashed #edf2ee;
      font-size: 0.9rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .dt-lbl { color: var(--muted); font-size: 0.86rem; flex-shrink: 0; white-space: nowrap; }
    .dt-val { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; word-break: break-word; }
    .c-up { color: #d6324a; }
    .c-down { color: #1f9d55; }
    .auction-tag-btn { display: inline-flex; align-items: center; gap: 3px; font-size: 0.82rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #f0fdf4; color: #166534 !important; border: 1px solid #bbf7d0; text-decoration: none; transition: all 0.15s ease; }
    .auction-tag-btn:hover { background: #dcfce7; border-color: #86efac; }
    .detail-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      padding: 11px 16px;
      background: #2b56df;
      color: #fff !important;
      font-weight: 800;
      font-size: 0.92rem;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(43,86,223,.2);
      transition: background .15s ease;
      box-sizing: border-box;
      max-width: 100%;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail-btn:hover { background: #1e42bd; }
    .null { color: #98a29c; }

    .state {
      padding: 50px 20px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: right;
    }

    @media (max-width: 768px) {
      .page { padding: 28px 12px 48px; }
      header { align-items: start; flex-direction: column; }
      h1 { font-size: clamp(1.85rem, 8vw, 2.5rem); }
      .source-badge { align-self: start; }
      .controls { grid-template-columns: 1fr; gap: 12px; padding: 15px; }
      select, input { width: 100%; min-width: 0; font-size: 16px; }
      .filter-toggle-bar { padding: 10px 14px; }
      .filter-toggle-hint { display: none; }
      .filters { padding: 12px 14px; gap: 10px 14px; }
      .result-bar { align-items: start; flex-direction: column; padding: 12px 15px; }
      th, td { padding: 12px 14px; }
      table { min-width: 2100px; }
      th { font-size: 0.75rem; }
      td { font-size: 0.85rem; }
      th:first-child, td:first-child { font-size: 0.76rem; }

      .quick-view-td {
        padding: 0 4px 12px !important;
      }
      .quick-view-card {
        left: 4px;
        width: calc(100vw - 32px);
        max-width: calc(100vw - 32px);
        padding: 12px 12px;
        border-radius: 12px;
      }
      .quick-view-header {
        padding-right: 26px;
        gap: 6px;
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      .quick-cb-title { font-size: 1.05rem; }
      .quick-cb-dates { font-size: 0.78rem; }
      .quick-price { font-size: 1.15rem; }
      .quick-conv { font-size: 0.75rem; }
      .detail-row {
        font-size: 0.84rem;
        padding: 5px 0;
        gap: 8px;
      }
      .dt-lbl { font-size: 0.8rem; }
      .dt-val { font-size: 0.84rem; }
      .detail-btn {
        margin-top: 10px;
        padding: 9px 10px;
        font-size: 0.82rem;
        white-space: normal;
        line-height: 1.35;
      }
    }

    @media (max-width: 480px) {
      .page { padding-right: 12px; padding-left: 12px; }
      header { gap: 14px; margin: 18px 0 16px; }
      h1 { font-size: 1.85rem; }
      .panel { border-radius: 15px; }
      table { min-width: 2100px; }
      th, td { padding: 10px 12px; }
      th { font-size: 0.72rem; }
      td { font-size: 0.82rem; }

      .quick-view-td {
        padding: 0 2px 10px !important;
      }
      .quick-view-card {
        left: 2px;
        width: calc(100vw - 28px);
        max-width: calc(100vw - 28px);
        padding: 10px 10px;
        border-radius: 10px;
      }
      .quick-cb-title { font-size: 1rem; }
      .quick-cb-dates { font-size: 0.72rem; }
      .quick-price { font-size: 1.08rem; }
      .quick-conv { font-size: 0.7rem; }
      .detail-row {
        font-size: 0.8rem;
        padding: 4px 0;
        gap: 6px;
      }
      .dt-lbl { font-size: 0.76rem; }
      .dt-val { font-size: 0.8rem; }
      .detail-btn {
        margin-top: 8px;
        padding: 8px 8px;
        font-size: 0.78rem;
        white-space: normal;
        line-height: 1.35;
      }
    }
  </style><link rel="stylesheet" href="site-shell.css">
</head>
<body>
  <main class="page">
    <nav aria-label="全站導覽"><a href="index.html">首頁</a><a href="institutional.html">法人籌碼</a><a href="strategy-a.html">成交量10日新高</a><a href="strategy-b.html">CB突破轉換價</a><a href="strategy-c.html">CB資優生</a><a href="strategy-g.html">時間發動</a><a href="daily-market.html">每日行情</a></nav>

    <header><h1>CB Radar｜每日行情</h1><div class="source-badge">資料來源 · TPEx</div></header>

    <section class="panel">
      <div class="controls">
        <label>交易日期
          <select id="dateSelect" aria-label="選擇交易日期"></select>
        </label>
        <label>搜尋 CB
          <input id="searchInput" type="search" placeholder="輸入 CB 名稱或代號" autocomplete="off">
        </label>
        <button id="exportExcel" type="button">匯出 Excel</button>
      </div>

      <details id="filterCollapse" class="filter-collapse">
        <summary class="filter-toggle-bar">
          <div class="filter-toggle-left">
            <span class="filter-toggle-arrow">▶</span>
            <span class="filter-toggle-title">篩選條件</span>
            <span class="filter-toggle-hint"></span>
          </div>
        </summary>
        <div class="filters" aria-label="篩選CB條件">
          <div class="range"><span>CB參考價</span><input data-f="reference_price" data-b="min" type="number" step="any" inputmode="decimal" aria-label="參考價下限"><i>~</i><input data-f="reference_price" data-b="max" type="number" step="any" inputmode="decimal" aria-label="參考價上限"></div>
          <div class="range"><span>轉換價值</span><input data-f="conversion_value" data-b="min" type="number" step="any" inputmode="decimal" aria-label="轉換價值下限"><i>~</i><input data-f="conversion_value" data-b="max" type="number" step="any" inputmode="decimal" aria-label="轉換價值上限"></div>
          <div class="range"><span>折溢價(%)</span><input data-f="premium_rate" data-b="min" type="number" step="any" inputmode="decimal" aria-label="溢價率下限"><i>~</i><input data-f="premium_rate" data-b="max" type="number" step="any" inputmode="decimal" aria-label="溢價率上限"></div>
          <div class="range"><span>剩餘比率(%)</span><input data-f="balance_ratio" data-b="min" type="number" step="any" inputmode="decimal" aria-label="剩餘比率下限"><i>~</i><input data-f="balance_ratio" data-b="max" type="number" step="any" inputmode="decimal" aria-label="剩餘比率上限"></div>
          <div class="range"><span>是否擔保</span><select id="securedFilter" aria-label="是否擔保"><option value="">全部</option><option value="有">有</option><option value="無">無</option></select></div>
          <div class="range"><span>距到期 大於</span><input id="daysMin" data-f="remaining_days" data-b="min" type="number" min="0" step="1" inputmode="numeric" aria-label="距到期天數下限"><span>天</span></div>
          <div class="range"><span>發行日</span><input data-f="issue_date" data-b="min" type="date" aria-label="發行日起"><i>~</i><input data-f="issue_date" data-b="max" type="date" aria-label="發行日迄"></div>
          <div class="range"><span>到期日</span><input data-f="maturity_date" data-b="min" type="date" aria-label="到期日起"><i>~</i><input data-f="maturity_date" data-b="max" type="date" aria-label="到期日迄"></div>
          <button id="clearFilters" type="button">預設條件</button>
          <button id="emptyFilters" type="button">清空條件</button>
        </div>
      </details>

      <div class="result-bar">
        <strong id="resultCount">載入中…</strong>
        <span id="activeFilter">準備行情資料</span>

      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sticky-name" aria-sort="none"><button type="button" data-sort="cb_name">CB名稱 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="reference_price">CB市價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="volume_lots">成交量（張） <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="conversion_value">轉換價值 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="premium_rate">溢價率 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="balance_ratio">餘額比例 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="remaining_days">剩餘天數 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="underwriting_method">承銷方式 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="auction_avg_price">競拍均價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="is_secured">擔保 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="issue_date">發行日 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="maturity_date">到期日 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="put_date">首次賣回日 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="issue_units">發行張數 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="issue_amount_yi">發行總額（億元） <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="balance_units">餘額張數 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="balance_date">餘額日期 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="current_conversion_price">最新轉換價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="current_conversion_price_effective_date">轉換價生效日 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="delisting_date">下市日期 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="delisting_reason">下市原因 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="volume_ma5">5日均量 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="volume_ma10">10日均量 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="price_ma20">20日均價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="price_ma43">43日均價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="p_close_price">母股收盤價 <span class="sort-mark"></span></button></th>
              <th aria-sort="none"><button type="button" data-sort="p_volume_lots">母股成交量（張） <span class="sort-mark"></span></button></th>
            </tr>
          </thead>
          <tbody id="resultsBody"><tr><td class="state" colspan="29">行情資料載入中…</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer>每日資料由 CB Collector 自動更新</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="data-loader.js?v=20261102b"></script>
  <script>
    const state = { records: [], selectedDate: "", query: "", sortKey: "cb_code", sortDirection: "asc" };
    const numberFormat = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 4 });
    const valuationFormat = new Intl.NumberFormat("zh-TW", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    const SORT_TYPES = {
      cb_name: "text",
      cb_code: "text",
      underwriting_method: "text",
      auction_avg_price: "number",
      issue_date: "date",
      maturity_date: "date",
      put_date: "date",
      remaining_days: "number",
      issue_units: "number",
      issue_amount_yi: "number",
      balance_units: "number",
      balance_date: "date",
      balance_ratio: "number",
      current_conversion_price: "number",
      current_conversion_price_effective_date: "date",
      is_secured: "text",
      delisting_date: "date",
      delisting_reason: "text",
      close_price: "number",
      reference_price: "number",
      volume_lots: "number",
      volume_ma5: "number",
      volume_ma10: "number",
      price_ma20: "number",
      price_ma43: "number",
      p_close_price: "number",
      p_volume_lots: "number",
      conversion_value: "number",
      premium_rate: "number"
    };
    const elements = {
      dateSelect: document.querySelector("#dateSelect"),
      searchInput: document.querySelector("#searchInput"),
      body: document.querySelector("#resultsBody"),
      resultCount: document.querySelector("#resultCount"),
      activeFilter: document.querySelector("#activeFilter"),
      exportExcel: document.querySelector("#exportExcel")
    };

    function hasValue(value) {
      return value !== null && value !== undefined && value !== "";
    }

    function compareValues(a, b) {
      let aValue = a[state.sortKey];
      let bValue = b[state.sortKey];
      if (state.sortKey === "underwriting_method") {
        aValue = (auctionMap.get(a.cb_code) || {}).underwriting_method || "詢圈";
        bValue = (auctionMap.get(b.cb_code) || {}).underwriting_method || "詢圈";
      } else if (state.sortKey === "auction_avg_price") {
        aValue = (auctionMap.get(a.cb_code) || {}).avg_price;
        bValue = (auctionMap.get(b.cb_code) || {}).avg_price;
      }
      if (!hasValue(aValue) && !hasValue(bValue)) return 0;
      if (!hasValue(aValue)) return 1;
      if (!hasValue(bValue)) return -1;

      const sortType = SORT_TYPES[state.sortKey];
      const result = sortType === "number"
        ? Number(aValue) - Number(bValue)
        : sortType === "date"
          ? new Date(`${aValue}T00:00:00Z`) - new Date(`${bValue}T00:00:00Z`)
          : String(aValue).localeCompare(String(bValue), "zh-Hant", { numeric: true, sensitivity: "base" });
      return state.sortDirection === "asc" ? result : -result;
    }

    function selectedDateRows() {
      return state.records.filter((record) => record.trade_date === state.selectedDate);
    }

    const FILTER_FIELDS = { issue_date: "發行日", maturity_date: "到期日", reference_price: "參考價", conversion_value: "轉換價值", premium_rate: "折溢價%", balance_ratio: "剩餘比率%", remaining_days: "距到期天" };
    const DEFAULT_MIN_DAYS = "365";

    function readFilters() {
      const ranges = {};
      document.querySelectorAll(".filters input[data-f]").forEach((input) => {
        const isDate = input.type === "date";
        if (input.value.trim() === "" || (!isDate && !Number.isFinite(Number(input.value)))) return;
        (ranges[input.dataset.f] ||= {})[input.dataset.b] = isDate ? input.value : Number(input.value);
      });
      return { ranges, secured: document.querySelector("#securedFilter").value };
    }

    function matchesFilters(record, filters) {
      if (filters.secured && record.is_secured !== filters.secured) return false;
      for (const [key, { min, max }] of Object.entries(filters.ranges)) {
        const value = record[key];
        if (value === null || value === undefined) return false;
        if (min !== undefined && (key === "remaining_days" ? value <= min : value < min)) return false;
        if (max !== undefined && value > max) return false;
      }
      return true;
    }

    function describeFilters(filters) {
      const parts = Object.entries(filters.ranges).map(([key, { min, max }]) =>
        key === "remaining_days" ? `${FILTER_FIELDS[key]}>${min}` : `${FILTER_FIELDS[key]} ${String(min ?? "").replaceAll("-", "/")}~${String(max ?? "").replaceAll("-", "/")}`);
      if (filters.secured) parts.push(`擔保：${filters.secured}`);
      return parts.join("；");
    }

    function filteredRows() {
      const query = state.query.trim().toLocaleLowerCase("zh-Hant");
      const filters = readFilters();
      return selectedDateRows()
        .filter((record) => !query || record.cb_code.toLocaleLowerCase().includes(query) || record.cb_name.toLocaleLowerCase("zh-Hant").includes(query))
        .filter((record) => matchesFilters(record, filters))
        .sort(compareValues);
    }

    function cell(value, className = "") {
      const node = document.createElement("td");
      node.className = className;
      node.textContent = value;
      return node;
    }

    function updateSortHeaders() {
      document.querySelectorAll("th[aria-sort]").forEach((header) => {
        const button = header.querySelector("button");
        const active = button.dataset.sort === state.sortKey;
        header.setAttribute("aria-sort", active ? (state.sortDirection === "asc" ? "ascending" : "descending") : "none");
        button.querySelector(".sort-mark").textContent = active ? (state.sortDirection === "asc" ? "▲" : "▼") : "";
      });
    }

    function render() {
      updateSortHeaders();
      const rows = filteredRows();
      elements.resultCount.textContent = `共 ${numberFormat.format(rows.length)} 筆結果`;
      elements.activeFilter.textContent = state.selectedDate;
      elements.body.replaceChildren();

      if (!rows.length) {
        const row = document.createElement("tr");
        row.append(cell("沒有符合條件的 CB", "state"));
        row.firstChild.colSpan = 27;
        elements.body.append(row);
        return;
      }

      const fragment = document.createDocumentFragment();
      rows.forEach((record) => {
        const row = document.createElement("tr");
        row.className = "cb-data-row";
        row.title = "點擊整列可開合速覽卡片";

        const nameCell = cell("", "sticky-name");
        const wrap = document.createElement("div");
        wrap.className = "sticky-name-wrap";
        
        const arrow = document.createElement("span");
        arrow.className = "row-arrow";
        arrow.textContent = "▶";
        
        const link = document.createElement("a");
        link.href = `cb-detail.html?code=${encodeURIComponent(record.cb_code)}`;
        link.title = "查看走勢圖";
        link.textContent = record.cb_name;
        
        wrap.append(arrow, link);
        nameCell.append(wrap);
        row.append(nameCell);

        const auc = auctionMap.get(record.cb_code) || {};
        const method = auc.underwriting_method || (auc.avg_price ? "競拍" : "詢圈");
        const avgPrice = auc.avg_price;

        // 1. CB市價 (抓參考價顯示，無則抓收盤價)
        const marketPriceVal = record.reference_price ?? record.close_price;
        row.append(cell(marketPriceVal === null ? "" : numberFormat.format(marketPriceVal), `numeric ${marketPriceVal === null ? "null" : ""}`));

        // 2. 成交量（張）
        row.append(cell(numberFormat.format(record.volume_lots), `numeric ${record.volume_lots === 0 ? "zero" : ""}`));

        // 3. 轉換價值
        row.append(cell(record.conversion_value === null ? "" : valuationFormat.format(record.conversion_value), `numeric ${record.conversion_value === null ? "null" : ""}`));

        // 4. 溢價率
        row.append(cell(record.premium_rate === null ? "" : `${valuationFormat.format(record.premium_rate)}%`, `numeric ${record.premium_rate === null ? "null" : ""}`));

        // 5. 餘額比例
        row.append(cell(record.balance_ratio === null ? "" : `${valuationFormat.format(record.balance_ratio)}%`, `numeric ${record.balance_ratio === null ? "null" : ""}`));

        // 6. 剩餘天數
        row.append(cell(record.remaining_days === null ? "" : numberFormat.format(record.remaining_days), `numeric ${record.remaining_days === null ? "null" : ""}`));

        // 7. 承銷方式 (競拍 / 詢圈)
        const methodCell = cell("");
        const methodBadge = document.createElement("span");
        methodBadge.className = `tag-method ${method === "競拍" ? "method-auction" : "method-inquiry"}`;
        methodBadge.textContent = method;
        methodCell.append(methodBadge);
        row.append(methodCell);

        // 8. 競拍均價
        const avgCell = cell("", "numeric");
        if (avgPrice) {
          const avgText = document.createElement("span");
          avgText.style.fontWeight = "700";
          avgText.textContent = valuationFormat.format(avgPrice);
          const extLink = document.createElement("a");
          extLink.href = `https://www.google.com/search?q=${encodeURIComponent(`${record.cb_name} ${record.cb_code} 競價拍賣 開標結果 得標加權平均價格`)}`;
          extLink.target = "_blank";
          extLink.rel = "noopener";
          extLink.className = "auction-mini-link";
          extLink.title = "前往查詢官方開標統計表";
          extLink.textContent = " ↗";
          avgCell.append(avgText, extLink);
        } else {
          avgCell.textContent = "—";
          avgCell.className = "numeric null";
        }
        row.append(avgCell);

        // 9. 擔保
        row.append(cell(record.is_secured));

        // 10. 發行日
        row.append(cell(record.issue_date));

        // 11. 到期日
        row.append(cell(record.maturity_date));

        // 12. 首次賣回日
        row.append(cell(record.put_date));

        // 13. 發行張數
        row.append(cell(record.issue_units === null ? "" : numberFormat.format(record.issue_units), "numeric"));

        // 14. 發行總額（億元）
        row.append(cell(record.issue_amount_yi === null ? "" : numberFormat.format(record.issue_amount_yi), "numeric"));

        // 15. 餘額張數
        row.append(cell(record.balance_units === null ? "" : numberFormat.format(record.balance_units), "numeric"));

        // 16. 餘額日期
        row.append(cell(record.balance_date));

        // 17. 最新轉換價
        row.append(cell(record.current_conversion_price === null ? "" : numberFormat.format(record.current_conversion_price), "numeric"));

        // 18. 轉換價生效日
        row.append(cell(record.current_conversion_price_effective_date));

        // 19. 下市日期
        row.append(cell(record.delisting_date));

        // 20. 下市原因
        row.append(cell(record.delisting_reason));

        // 21. 5日均量
        row.append(cell(record.volume_ma5 === null ? "" : new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(record.volume_ma5), "numeric"));

        // 22. 10日均量
        row.append(cell(record.volume_ma10 === null ? "" : new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(record.volume_ma10), "numeric"));

        // 23. 20日均價
        row.append(cell(record.price_ma20 === null ? "" : valuationFormat.format(record.price_ma20), "numeric"));

        // 24. 43日均價
        row.append(cell(record.price_ma43 === null ? "" : valuationFormat.format(record.price_ma43), "numeric"));

        // 25. 母股收盤價
        row.append(cell(record.p_close_price === null ? "" : numberFormat.format(record.p_close_price), `numeric ${record.p_close_price === null ? "null" : ""}`));

        // 26. 母股成交量（張）
        row.append(cell(record.p_volume_lots === null ? "" : new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(record.p_volume_lots), `numeric ${record.p_volume_lots === 0 ? "zero" : ""}`));
        fragment.append(row);

        // 開合速覽 sub-row
        const quickRow = document.createElement("tr");
        quickRow.className = "quick-view-row";
        quickRow.style.display = "none";
        const quickTd = document.createElement("td");
        quickTd.colSpan = 27;
        quickTd.className = "quick-view-td";

        const pVal = record.close_price ?? record.reference_price;
        const pStr = pVal === null ? "—" : numberFormat.format(pVal);
        const cpVal = record.current_conversion_price;
        const cpStr = cpVal === null ? "—" : numberFormat.format(cpVal);
        const cvVal = record.conversion_value;
        const cvStr = cvVal === null ? "—" : valuationFormat.format(cvVal);
        const premVal = record.premium_rate;
        const premStr = premVal === null ? "—" : `${premVal >= 0 ? "+" : ""}${valuationFormat.format(premVal)}%`;
        const premClass = premVal !== null ? (premVal >= 0 ? "c-up" : "c-down") : "";
        const securedStr = record.is_secured === "有" || record.is_secured === "是" ? "有擔保" : (record.is_secured === "無" || record.is_secured === "否" ? "無擔保" : (record.is_secured || "—"));
        const parentCode = String(record.cb_code).slice(0, 4);
        const auctionUrl = `https://www.google.com/search?q=${encodeURIComponent(`${record.cb_name} ${record.cb_code} 競價拍賣 開標結果 得標加權平均價格`)}`;
        const spStr = record.p_close_price === null ? "—" : numberFormat.format(record.p_close_price);
        const spVolStr = record.p_volume_lots === null ? "—" : `${new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(record.p_volume_lots)} 張`;
        const brStr = record.balance_ratio === null ? "—" : `${valuationFormat.format(record.balance_ratio)}%`;
        const iuStr = record.issue_units === null ? "—" : `${numberFormat.format(record.issue_units)} 張`;
        const buStr = record.balance_units === null ? "—" : `${numberFormat.format(record.balance_units)} 張`;
        const vlStr = record.volume_lots === null ? "—" : `${numberFormat.format(record.volume_lots)} 張`;
        const vMaStr = (record.volume_ma5 !== null || record.volume_ma10 !== null) ? `${record.volume_ma5 ? Math.round(record.volume_ma5) : "—"} / ${record.volume_ma10 ? Math.round(record.volume_ma10) : "—"} 張` : "—";
        const pMaStr = (record.price_ma20 !== null || record.price_ma43 !== null) ? `${record.price_ma20 ? valuationFormat.format(record.price_ma20) : "—"} / ${record.price_ma43 ? valuationFormat.format(record.price_ma43) : "—"}` : "—";
        const remDaysStr = record.remaining_days === null ? "—" : `${numberFormat.format(record.remaining_days)} 天`;

        quickTd.innerHTML = `
          <div class="quick-view-card">
            <button type="button" class="quick-close-btn" aria-label="收合速覽" title="收合速覽">✕</button>
            <div class="quick-view-header">
              <div class="quick-view-title-group">
                <span class="quick-cb-title">${record.cb_name}</span>
                <span class="tag-remain" style="background:#f3f4f6;color:#374151;">${record.cb_code}</span>
                <span class="quick-cb-dates">${record.issue_date || "—"} ～ ${record.maturity_date || "—"}</span>
                ${brStr !== "—" ? `<span class="tag-remain">剩餘 ${brStr}</span>` : ""}
                <span class="${record.is_secured === '有' || record.is_secured === '是' ? 'tag-secured' : 'tag-unsecured'}">${securedStr}</span>
              </div>
              <div class="quick-view-price-box">
                <div class="quick-price">${pStr}</div>
                <div class="quick-conv">轉換價 ${cpStr}</div>
              </div>
            </div>
            <div class="detail-grid">
              <div class="detail-row"><span class="dt-lbl">轉換價值</span><span class="dt-val">${cvStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">折溢價</span><span class="dt-val ${premClass}">${premStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">當日成交量</span><span class="dt-val">${vlStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">母股股價</span><span class="dt-val">${spStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">母股成交量</span><span class="dt-val">${spVolStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">發行張數 / 餘額張數</span><span class="dt-val">${iuStr} / ${buStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">首次賣回日</span><span class="dt-val">${record.put_date || "—"}</span></div>
              <div class="detail-row"><span class="dt-lbl">距到期天數</span><span class="dt-val">${remDaysStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">5日均量 / 10日均量</span><span class="dt-val">${vMaStr}</span></div>
              <div class="detail-row"><span class="dt-lbl">20日均價 / 43日均價</span><span class="dt-val">${pMaStr}</span></div>
            </div>
            <a href="cb-detail.html?code=${encodeURIComponent(record.cb_code)}" class="detail-btn">
              📄 ${record.cb_name} CB詳細內容（查看走勢圖）
            </a>
          </div>
        `;
        quickRow.append(quickTd);
        fragment.append(quickRow);

        const closeBtn = quickTd.querySelector(".quick-close-btn");
        if (closeBtn) {
          closeBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            quickRow.style.display = "none";
            row.classList.remove("row-expanded");
            arrow.textContent = "▶";
          });
        }

        row.addEventListener("click", (e) => {
          if (e.target.closest("a, button, input, select")) return;
          const open = quickRow.style.display !== "none";
          quickRow.style.display = open ? "none" : "";
          row.classList.toggle("row-expanded", !open);
          arrow.textContent = open ? "▶" : "▼";
        });
      });
      elements.body.append(fragment);
    }

    document.querySelectorAll("button[data-sort]").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.dataset.sort;
        if (state.sortKey === key) state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
        else {
          state.sortKey = key;
          state.sortDirection = "asc";
        }
        render();
      });
    });

    elements.dateSelect.addEventListener("change", async () => {
      state.selectedDate = elements.dateSelect.value;
      try {
        const payload = await CBRadarData.month("market", state.selectedDate);
        state.records = payload.records;
        render();
      } catch (error) {
        elements.resultCount.textContent = "載入失敗";
        elements.activeFilter.textContent = error.message;
      }
    });

    const DEFAULT_FILTERS = {
      "reference_price:min": "90", "reference_price:max": "110",
      "conversion_value:min": "90", "conversion_value:max": "110",
      "premium_rate:min": "0", "premium_rate:max": "20",
      "balance_ratio:min": "80", "balance_ratio:max": "100",
      "remaining_days:min": DEFAULT_MIN_DAYS
    };
    function applyDefaultFilters() {
      document.querySelectorAll(".filters input[data-f]").forEach((input) => {
        input.value = DEFAULT_FILTERS[`${input.dataset.f}:${input.dataset.b}`] ?? "";
      });
      document.querySelector("#securedFilter").value = "";
    }
    // 預設不套用過濾條件，完整顯示最新日行情；使用者可依需求點擊「預設條件」篩選
    // applyDefaultFilters();
    const dateInputs = document.querySelectorAll('.filters input[type="date"]');
    const syncDateHints = () => dateInputs.forEach((input) => input.classList.toggle("is-empty", !input.value));
    syncDateHints();
    document.addEventListener("input", syncDateHints);
    document.addEventListener("click", () => setTimeout(syncDateHints));
    document.querySelectorAll(".filters input, .filters select").forEach((control) => control.addEventListener("input", render));
    document.querySelector("#clearFilters").addEventListener("click", () => { applyDefaultFilters(); render(); });
    document.querySelector("#emptyFilters").addEventListener("click", () => {
      document.querySelectorAll(".filters input").forEach((input) => { input.value = ""; });
      document.querySelector("#securedFilter").value = "";
      elements.searchInput.value = "";
      state.query = "";
      render();
    });

    elements.searchInput.addEventListener("input", () => {
      state.query = elements.searchInput.value;
      render();
    });

    const EXPORT_COLUMNS = [
      ["CB名稱", "cb_name"],
      ["CB市價", "reference_price"],
      ["成交量（張）", "volume_lots"],
      ["轉換價值", "conversion_value"],
      ["溢價率", "premium_rate"],
      ["餘額比例", "balance_ratio"],
      ["剩餘天數", "remaining_days"],
      ["承銷方式", "underwriting_method"],
      ["競拍均價", "auction_avg_price"],
      ["擔保", "is_secured"],
      ["發行日", "issue_date"],
      ["到期日", "maturity_date"],
      ["首次賣回日", "put_date"],
      ["發行張數", "issue_units"],
      ["發行總額（億元）", "issue_amount_yi"],
      ["餘額張數", "balance_units"],
      ["餘額日期", "balance_date"],
      ["最新轉換價", "current_conversion_price"],
      ["轉換價生效日", "current_conversion_price_effective_date"],
      ["下市日期", "delisting_date"],
      ["下市原因", "delisting_reason"],
      ["5日均量", "volume_ma5"],
      ["10日均量", "volume_ma10"],
      ["20日均價", "price_ma20"],
      ["43日均價", "price_ma43"],
      ["母股收盤價", "p_close_price"],
      ["母股成交量（張）", "p_volume_lots"]
    ];
    elements.exportExcel.addEventListener("click", () => {
      if (typeof XLSX === "undefined") return window.alert("Excel 匯出元件載入失敗，請確認網路連線後重試。");
      const sheet = XLSX.utils.aoa_to_sheet([
        EXPORT_COLUMNS.map(([label]) => label),
        ...filteredRows().map((record) => {
          const auc = auctionMap.get(record.cb_code) || {};
          return EXPORT_COLUMNS.map(([, key]) => {
            if (key === "reference_price") return record.reference_price ?? record.close_price ?? "";
            if (key === "underwriting_method") return auc.underwriting_method || (auc.avg_price ? "競拍" : "詢圈");
            if (key === "auction_avg_price") return auc.avg_price ?? "";
            return record[key] ?? "";
          });
        })
      ]);
      ["volume_lots","volume_ma5","volume_ma10","issue_units","balance_units","p_volume_lots","remaining_days"].forEach(key=>{const i=EXPORT_COLUMNS.findIndex(c=>c[1]===key); if(i>=0) for(let r=2;sheet[`${XLSX.utils.encode_col(i)}${r}`];r++) sheet[`${XLSX.utils.encode_col(i)}${r}`].z="0"}); ["price_ma20","price_ma43","reference_price","current_conversion_price","p_close_price","conversion_value","premium_rate","balance_ratio","auction_avg_price"].forEach(key=>{const i=EXPORT_COLUMNS.findIndex(c=>c[1]===key); if(i>=0) for(let r=2;sheet[`${XLSX.utils.encode_col(i)}${r}`];r++) sheet[`${XLSX.utils.encode_col(i)}${r}`].z="0.00"}); const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, sheet, "每日行情");
      XLSX.writeFile(workbook, `CB每日行情_${state.selectedDate}.xlsx`);
    });

    let auctionMap = new Map();
    const loadAuctions = (typeof CBRadarData !== "undefined" && typeof CBRadarData.auctions === "function")
      ? CBRadarData.auctions()
      : fetch("./data/v2/auctions.json", { cache: "no-store" })
          .then((r) => r.ok ? r.json() : { schema_version: 2, records: {} })
          .catch(() => ({ schema_version: 2, records: {} }));

    Promise.all([CBRadarData.manifest(), CBRadarData.latest(), loadAuctions])
      .then(([manifest, payload, aucPayload]) => {
        if (aucPayload && aucPayload.records) {
          auctionMap = new Map(Object.entries(aucPayload.records));
        }
        if (!payload || !Array.isArray(payload.records)) throw new Error("資料格式不正確");
        state.records = payload.records;
        const dates = manifest.market_dates || [];
        if (!dates.length) throw new Error("資料庫目前沒有行情資料");
        dates.forEach((date) => elements.dateSelect.add(new Option(date, date)));
        state.selectedDate = payload.trade_date;
        state.latestDate = payload.trade_date;
        elements.dateSelect.value = state.selectedDate;
        render();
      })
      .catch((error) => {
        console.error("載入行情資料失敗：", error);
        elements.resultCount.textContent = "載入失敗";
        elements.activeFilter.textContent = error.message;
        const row = document.createElement("tr");
        row.append(cell(`無法載入行情資料：${error.message}`, "state"));
        row.firstChild.colSpan = 27;
        elements.body.replaceChildren(row);
      });
  </script>
</body>
</html>
