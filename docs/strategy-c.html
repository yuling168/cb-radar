<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site-shell.css">
<title>CB資優生｜CB Radar</title><style>:root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:40px 16px 64px}a{color:var(--green)}nav{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:24px}.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}.title-row h1{margin:0}.strategy-id{margin:0;color:var(--muted);font-size:.88rem}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.conditions-panel{margin-top:12px;padding:13px 16px}.conditions-panel h2{margin:0 0 5px;font-size:1.08rem}.conditions-panel ol{margin:0;padding-left:22px}.conditions-panel li+li{margin-top:3px}select{min-height:42px;padding:8px;width:220px;font:inherit}.state{padding:12px 0}.bucket{margin-top:22px}.unavailable{border-left:4px solid #a5782b;padding:10px;margin:8px 0;background:#fffaf0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted)}@media(max-width:700px){.page{padding:24px 12px}table{min-width:820px}}</style>
</head><body><main class="page"><nav><a href="index.html">首頁</a>　<a href="institutional.html">法人籌碼</a>　<a href="strategy-a.html">成交量10日新高</a>　<a href="strategy-b.html">CB突破轉換價</a>　<a href="strategy-c.html">CB資優生</a>　<a href="strategy-g.html">時間發動</a>　<a href="daily-market.html">每日行情</a></nav><header class="title-row"><h1>CB資優生</h1><p class="strategy-id">策略 C · v1</p></header><section class="panel conditions-panel"><h2>完整策略條件</h2><ol><li>轉換價值介於 100 至 120（含）。</li><li>已轉換比例不超過 20%。</li><li>轉換溢價率嚴格高於 5%。</li><li>依轉換價值分為四個區間；各區按溢價率降冪、CB 代號升冪，僅保留前二名。</li></ol></section><section class="panel"><label>交易日期　<select id="dateSelect"></select></label><p id="summary" class="state">載入中…</p><div id="buckets"></div><h2>資料不足、無法評估</h2><div id="unavailable"></div></section></main><script>
const $=s=>document.querySelector(s),nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2}),priceFormat=new Intl.NumberFormat("zh-TW",{minimumFractionDigits:2,maximumFractionDigits:2});let signals=[],evaluations=[],selected="";const buckets=["100-105","105-110","110-115","115-120"],blank="";
function formatDate(value){if(!value)return blank;const [year,month,day]=String(value).split("-");return `${year}/${Number(month)}/${Number(day)}`}
function render(){const hit=signals.filter(r=>r.trade_date===selected),bad=evaluations.filter(r=>r.trade_date===selected&&r.data_status==="UNAVAILABLE");$("#buckets").replaceChildren();$("#unavailable").replaceChildren();$("#summary").textContent=hit.length?`${selected}：${hit.length} 檔符合策略 C-v1。`:`${selected}：沒有符合策略 C-v1 的訊號。`;buckets.forEach(bucket=>{const rows=hit.filter(r=>(r.condition_values||{}).conversion_value_bucket===bucket);const section=document.createElement("section");section.className="bucket";section.innerHTML=`<h2>轉換價值 ${bucket}</h2>`;if(!rows.length){const p=document.createElement("p");p.textContent="此區間沒有訊號。";section.append(p)}else{const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.innerHTML="<thead><tr><th>排名</th><th>CB</th><th>收盤價</th><th>轉換價值</th><th>溢價率</th><th>已轉換比例</th><th>賣回日</th><th>到期日</th></tr></thead>";const body=document.createElement("tbody");rows.sort((a,b)=>(a.condition_values.bucket_rank-b.condition_values.bucket_rank)||a.cb_code.localeCompare(b.cb_code)).forEach(r=>{const v=r.condition_values,tr=document.createElement("tr");[v.bucket_rank,`${r.cb_name||"—"}（${r.cb_code}）`,r.close_price===null||r.close_price===undefined?blank:priceFormat.format(r.close_price),nf.format(v.conversion_value),`${nf.format(v.premium_rate_pct)}%`,`${nf.format(v.converted_ratio_pct)}%`,formatDate(r.put_date),formatDate(r.maturity_date)].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);section.append(wrap)}$("#buckets").append(section)});if(bad.length){const n=document.createElement("div");n.className="unavailable";const total=bad.reduce((sum,row)=>sum+row.evaluation_count,0);n.textContent=`共 ${total} 檔資料不足、無法評估：${bad.map(row=>`${row.unavailable_reason}（${row.evaluation_count}）`).join("、")}`;$("#unavailable").append(n)}else $("#unavailable").textContent="本日沒有資料不足的評估結果。"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{signals=Array.isArray(p.strategy_c_signals)?p.strategy_c_signals:[];evaluations=Array.isArray(p.strategy_c_evaluations)?p.strategy_c_evaluations:[];const dates=[...new Set([...signals,...evaluations].map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("尚無策略 C-v1 已保存的評估資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));selected=dates[0];render()}).catch(e=>$("#summary").textContent=e.message);$("#dateSelect").addEventListener("change",e=>{selected=e.target.value;render()});
</script></body></html>
