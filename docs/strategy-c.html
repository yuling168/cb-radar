<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略 C-v1｜CB Radar</title><style>:root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:40px 16px 64px}a{color:var(--green)}p{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}select{min-height:42px;padding:8px;width:220px;font:inherit}.state{padding:12px 0}.bucket{margin-top:22px}.unavailable{border-left:4px solid #a5782b;padding:10px;margin:8px 0;background:#fffaf0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted)}@media(max-width:700px){.page{padding:24px 12px}table{min-width:820px}}</style>
</head><body><main class="page"><nav><a href="index.html">← 每日行情</a>　<a href="strategy-a.html">策略 A-v1</a>　<a href="strategy-b.html">策略 B-v1</a>　<a href="strategy-g.html">策略 G-v1</a></nav><h1>策略 C-v1</h1><p>CB 資優生：各轉換價值區間按溢價率選前二名。顯示已保存快照，不在瀏覽器重新計算。</p><section class="panel"><label>交易日期　<select id="dateSelect"></select></label><p id="summary" class="state">載入中…</p><div id="buckets"></div><h2>資料不足、無法評估</h2><div id="unavailable"></div></section></main><script>
const $=s=>document.querySelector(s),nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});let signals=[],evaluations=[],selected="";const labels={conversion_value_in_100_to_120:"轉換價值介於 100–120",converted_ratio_at_most_20_pct:"已轉換比例不超過 20%",premium_rate_above_5_pct:"溢價率高於 5%",within_bucket_top_two:"區間前二名"};const buckets=["100-105","105-110","110-115","115-120"];
function conditions(row){return Object.entries(row.condition_results||{}).map(([k,v])=>`${v?"✓":"✗"} ${labels[k]||k}`).join("；")}function render(){const hit=signals.filter(r=>r.trade_date===selected),bad=evaluations.filter(r=>r.trade_date===selected&&r.data_status==="UNAVAILABLE");$("#buckets").replaceChildren();$("#unavailable").replaceChildren();$("#summary").textContent=hit.length?`${selected}：${hit.length} 檔符合策略 C-v1。`:`${selected}：沒有符合策略 C-v1 的訊號。`;buckets.forEach(bucket=>{const rows=hit.filter(r=>(r.condition_values||{}).conversion_value_bucket===bucket);const section=document.createElement("section");section.className="bucket";section.innerHTML=`<h2>轉換價值 ${bucket}</h2>`;if(!rows.length){const p=document.createElement("p");p.textContent="此區間沒有訊號。";section.append(p)}else{const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.innerHTML="<thead><tr><th>排名</th><th>CB</th><th>轉換價值</th><th>溢價率</th><th>已轉換比例</th><th>餘額日期</th><th>完整條件</th></tr></thead>";const body=document.createElement("tbody");rows.sort((a,b)=>(a.condition_values.bucket_rank-b.condition_values.bucket_rank)||a.cb_code.localeCompare(b.cb_code)).forEach(r=>{const v=r.condition_values,tr=document.createElement("tr");[v.bucket_rank,`${r.cb_name||"—"}（${r.cb_code}）`,nf.format(v.conversion_value),`${nf.format(v.premium_rate_pct)}%`,`${nf.format(v.converted_ratio_pct)}%`,v.balance_date,conditions(r)].forEach(x=>{const td=document.createElement("td");td.textContent=x;tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);section.append(wrap)}$("#buckets").append(section)});if(bad.length){const n=document.createElement("div");n.className="unavailable";const total=bad.reduce((sum,row)=>sum+row.evaluation_count,0);n.textContent=`共 ${total} 檔資料不足、無法評估：${bad.map(row=>`${row.unavailable_reason}（${row.evaluation_count}）`).join("、")}`;$("#unavailable").append(n)}else $("#unavailable").textContent="本日沒有資料不足的評估結果。"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{signals=Array.isArray(p.strategy_c_signals)?p.strategy_c_signals:[];evaluations=Array.isArray(p.strategy_c_evaluations)?p.strategy_c_evaluations:[];const dates=[...new Set([...signals,...evaluations].map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("尚無策略 C-v1 已保存的評估資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));selected=dates[0];render()}).catch(e=>$("#summary").textContent=e.message);$("#dateSelect").addEventListener("change",e=>{selected=e.target.value;render()});
</script></body></html>
