<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略 B-v1｜CB Radar</title><style>:root{--ink:#17211b;--muted:#637068;--line:#dce4de;--paper:#f4f7f3;--card:#fff;--green:#185c42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1180px;margin:auto;padding:40px 16px 64px}a{color:var(--green)}p{color:var(--muted)}.panel{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card)}select{min-height:42px;padding:8px;width:220px;font:inherit}.state{padding:12px 0}.unavailable{border-left:4px solid #a5782b;padding:10px;margin:8px 0;background:#fffaf0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.82rem;color:var(--muted)}.conditions{min-width:280px}@media(max-width:700px){.page{padding:24px 12px}table{min-width:1280px}}</style>
</head><body><main class="page"><nav><a href="index.html">← 每日行情</a>　<a href="strategy-a.html">策略 A-v1</a>　<a href="strategy-c.html">策略 C-v1</a>　<a href="strategy-g.html">策略 G-v1</a></nav><h1>策略 B-v1</h1><p>CB 突破轉換價：顯示已保存的 43／10／5／前 19 日窗口快照，不在瀏覽器重新計算。</p><section class="panel"><label>交易日期　<select id="dateSelect"></select></label><p id="summary" class="state">載入中…</p><div id="signals"></div><h2>資料不足、無法評估</h2><div id="unavailable"></div></section></main><script>
const $=s=>document.querySelector(s),nf=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:2});let signals=[],evaluations=[],selected="";
const labels={close_price_above_43_day_average:"收盤價高於 43 日均價",volume_above_10_day_average:"成交量高於 10 日均量",premium_rate_above_5_pct:"溢價率高於 5%",conversion_value_in_90_to_110:"轉換價值介於 90–110",converted_ratio_at_most_20_pct:"已轉換比例不超過 20%",five_day_average_volume_above_50_lots:"5 日均量高於 50 張",close_price_strictly_above_prior_19_high:"收盤嚴格高於前 19 日最高"};
function conditions(row){return Object.entries(row.condition_results||{}).map(([k,v])=>`${v?"✓":"✗"} ${labels[k]||k}`).join("；")}
function dates(values){return values&&values.length?values.join("、"):"—"}
function render(){const hit=signals.filter(r=>r.trade_date===selected),bad=evaluations.filter(r=>r.trade_date===selected&&r.data_status==="UNAVAILABLE");$("#signals").replaceChildren();$("#unavailable").replaceChildren();$("#summary").textContent=hit.length?`${selected}：${hit.length} 檔符合策略 B-v1。`:`${selected}：沒有符合策略 B-v1 的訊號。`;if(hit.length){const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.innerHTML="<thead><tr><th>CB</th><th>收盤價</th><th>43 日均價</th><th>當日量</th><th>10 日均量</th><th>5 日均量</th><th>前 19 日最高收盤</th><th>轉換價值</th><th>溢價率</th><th>已轉換比例</th><th>餘額日期</th><th>窗口日期</th><th>完整條件</th></tr></thead>";const body=document.createElement("tbody");hit.sort((a,b)=>a.cb_code.localeCompare(b.cb_code)).forEach(r=>{const v=r.condition_values||{},tr=document.createElement("tr"),windows=`43日：${dates(v.window_43_trade_dates)}\n10日：${dates(v.window_10_trade_dates)}\n5日：${dates(v.window_5_trade_dates)}\n前19日：${dates(v.prior_19_trade_dates)}`;[`${r.cb_name||"—"}（${r.cb_code}）`,nf.format(v.close_price),nf.format(v.average_43_close_price),`${nf.format(v.today_volume_lots)} 張`,`${nf.format(v.average_10_volume_lots)} 張`,`${nf.format(v.average_5_volume_lots)} 張`,nf.format(v.prior_19_high_close_price),nf.format(v.conversion_value),`${nf.format(v.premium_rate_pct)}%`,`${nf.format(v.converted_ratio_pct)}%`,v.balance_date||"—",windows,conditions(r)].forEach((x,i)=>{const td=document.createElement("td");td.textContent=x;if(i===12)td.className="conditions";tr.append(td)});body.append(tr)});table.append(body);wrap.append(table);$("#signals").append(wrap)}if(bad.length){const n=document.createElement("div");n.className="unavailable";const total=bad.reduce((sum,row)=>sum+row.evaluation_count,0),reasons=new Map();bad.forEach(row=>reasons.set(row.unavailable_reason,(reasons.get(row.unavailable_reason)||0)+row.evaluation_count));n.textContent=`共 ${total} 檔資料不足、無法評估：${[...reasons.entries()].map(([reason,count])=>`${reason}（${count}）`).join("、")}`;$("#unavailable").append(n)}else $("#unavailable").textContent="本日沒有資料不足的評估結果。"}
fetch("./data.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(Error(`HTTP ${r.status}`))).then(p=>{signals=Array.isArray(p.strategy_b_signals)?p.strategy_b_signals:[];evaluations=Array.isArray(p.strategy_b_evaluations)?p.strategy_b_evaluations:[];const dates=[...new Set([...signals,...evaluations].map(r=>r.trade_date))].sort().reverse();if(!dates.length)throw Error("尚無策略 B-v1 已保存的評估資料");dates.forEach(d=>$("#dateSelect").add(new Option(d,d)));selected=dates[0];render()}).catch(e=>$("#summary").textContent=e.message);$("#dateSelect").addEventListener("change",e=>{selected=e.target.value;render()});
</script></body></html>
