name: TPEx TLS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install diagnostic dependencies
        run: python -m pip install -r requirements.txt

      - name: Report runner environment
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=$(uname -a)"
          grep '^PRETTY_NAME=' /etc/os-release || true
          python - <<'PY'
          import os
          import platform
          import ssl
          import sys
          import certifi
          import requests
          import urllib3

          print(f"python={sys.version.replace(chr(10), ' ')}")
          print(f"platform={platform.platform()}")
          print(f"openssl={ssl.OPENSSL_VERSION}")
          print(f"requests={requests.__version__}")
          print(f"urllib3={urllib3.__version__}")
          print(f"certifi={certifi.__version__}")
          print(f"certifi_where={certifi.where()}")
          for name in (
              "SSL_CERT_FILE", "SSL_CERT_DIR", "REQUESTS_CA_BUNDLE",
              "CURL_CA_BUNDLE", "HTTPS_PROXY", "HTTP_PROXY",
          ):
              print(f"{name}={'SET' if os.environ.get(name) else 'NOT_SET'}")
          PY

      - name: Run curl TLS diagnostics
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local raw
            raw="$(mktemp)"
            set +e
            curl --verbose --head --max-time 30 "$url" > /dev/null 2> "$raw"
            local status=$?
            set -e
            echo "curl_label=$label exit_code=$status"
            sed -E \
              -e '/proxy env variable (HTTPS_PROXY|HTTP_PROXY)/c\* proxy_env=SET' \
              -e 's#(https?://)[^/@[:space:]]+@#\1***@#g' \
              "$raw"
            rm -f "$raw"
          }
          probe root "https://www.tpex.org.tw/"
          probe cbdaily_20260911 "https://www.tpex.org.tw/www/zh-tw/bond/cbDaily?date=2026%2F09%2F11&fileCode=rsta0113"

      - name: Run OpenSSL chain diagnostic
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          set +e
          openssl s_client -connect www.tpex.org.tw:443 -servername www.tpex.org.tw \
            -showcerts -verify_return_error < /dev/null > "$raw" 2>&1
          status=$?
          set -e
          echo "openssl_exit_code=$status"
          grep -E '^(depth=|verify error:|Verify return code:|subject=|issuer=|Certificate chain|[[:space:]]*[0-9]+ s:|[[:space:]]*i:)' "$raw" || true
          rm -f "$raw"

      - name: Compare Python TLS trust paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import certifi
          import requests
          import ssl
          import urllib.request

          url = "https://www.tpex.org.tw/www/zh-tw/bond/cbDaily?date=2026%2F09%2F11&fileCode=rsta0113"

          def probe(label, action):
              try:
                  result = action()
              except Exception as exc:
                  print(f"{label}=FAIL type={type(exc).__name__} message={exc}")
              else:
                  print(f"{label}=PASS {result}")

          def stdlib_system():
              context = ssl.create_default_context()
              with urllib.request.urlopen(url, context=context, timeout=30) as response:
                  return f"status={response.status}"

          def requests_default():
              with requests.Session() as session:
                  response = session.get(url, timeout=30)
                  return f"status={response.status_code}"

          def requests_certifi():
              with requests.Session() as session:
                  response = session.get(url, timeout=30, verify=certifi.where())
                  return f"status={response.status_code}"

          probe("python_system_ssl", stdlib_system)
          probe("requests_default", requests_default)
          probe("requests_explicit_certifi", requests_certifi)
          PY

      - name: Prove verified TWCA intermediate remediation
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          intermediate_url="https://sslserver.twca.com.tw/cacert/Cyber_SSL_2023.crt"
          expected_fingerprint="01AF2324D098098F5E0CDF6FAABADA430B21CCE777F47EACB26248B2FDA3E531"
          target_url="https://www.tpex.org.tw/www/zh-tw/bond/cbDaily?date=2026%2F09%2F11&fileCode=rsta0113"

          curl --fail --location --silent --show-error --output "$work/intermediate.der" "$intermediate_url"
          openssl x509 -inform DER -in "$work/intermediate.der" -out "$work/intermediate.pem"
          actual_fingerprint="$(openssl x509 -in "$work/intermediate.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          test "$actual_fingerprint" = "$expected_fingerprint"
          openssl x509 -in "$work/intermediate.pem" -noout -subject -issuer -serial -startdate -enddate

          certifi_bundle="$(python -c 'import certifi; print(certifi.where())')"
          cat "$certifi_bundle" "$work/intermediate.pem" > "$work/trusted-plus-twca.pem"
          openssl verify -show_chain -CAfile "$certifi_bundle" "$work/intermediate.pem"

          set +e
          printf '' | openssl s_client -connect www.tpex.org.tw:443 -servername www.tpex.org.tw \
            -showcerts -verify_return_error > "$work/s_client.txt" 2>&1
          set -e
          awk '
            /-----BEGIN CERTIFICATE-----/ { capture = 1 }
            capture { print }
            /-----END CERTIFICATE-----/ && capture { exit }
          ' "$work/s_client.txt" > "$work/tpex-leaf.pem"
          test -s "$work/tpex-leaf.pem"
          openssl verify -show_chain -CAfile "$work/trusted-plus-twca.pem" \
            -untrusted "$work/intermediate.pem" "$work/tpex-leaf.pem"

          curl --fail --location --silent --show-error --head \
            --cacert "$work/trusted-plus-twca.pem" "$target_url" | head -n 1
          BUNDLE="$work/trusted-plus-twca.pem" TARGET_URL="$target_url" python - <<'PY'
          import os
          import requests

          response = requests.get(
              os.environ["TARGET_URL"], timeout=30, verify=os.environ["BUNDLE"]
          )
          print(f"requests_temp_bundle=PASS status={response.status_code}")
          PY

          set +e
          printf '' | openssl s_client -connect www.tpex.org.tw:443 -servername www.tpex.org.tw \
            -verify_hostname wrong.example.invalid -CAfile "$work/trusted-plus-twca.pem" \
            -verify_return_error > "$work/wrong-host.txt" 2>&1
          wrong_host_status=$?
          openssl verify -attime 1805932800 -CAfile "$work/trusted-plus-twca.pem" \
            -untrusted "$work/intermediate.pem" "$work/tpex-leaf.pem" > "$work/expired.txt" 2>&1
          expired_status=$?
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$work/self-signed.key" -out "$work/self-signed.pem" \
            -subj "/CN=untrusted.example.invalid" > /dev/null 2>&1
          openssl verify -CAfile "$work/trusted-plus-twca.pem" "$work/self-signed.pem" > "$work/self-signed.txt" 2>&1
          self_signed_status=$?
          set -e
          test "$wrong_host_status" -ne 0
          test "$expired_status" -ne 0
          test "$self_signed_status" -ne 0
          grep -E 'hostname mismatch|Verify return code:' "$work/wrong-host.txt"
          grep -E 'certificate has expired' "$work/expired.txt"
          grep -E 'self-signed certificate' "$work/self-signed.txt"

      - name: Verify production TPEx TLS helper and daily endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests

          from collector import HTTP_TRANSIENT_MAX_ATTEMPTS
          from config import (
              TPEX_BASE_URL,
              TPEX_CB_DELISTED_URL,
              TPEX_CB_ISSUE_URL,
              TPEX_CB_LISTED_URL,
              TPEX_DAILY_MARKET_URL,
              TPEX_REPORT_CODE,
              TPEX_REPORT_INDEX_URL,
          )
          from tpex_tls import (
              TPEX_HOST,
              TWCA_INTERMEDIATE_SHA256,
              TWCA_INTERMEDIATE_URL,
              build_tpex_session,
          )

          session = build_tpex_session()
          try:
              bundle = session.ca_bundle
              assert bundle.bundle_path.is_file()
              assert bundle.intermediate_path.is_file()
              print(f"production_helper_import=PASS")
              print(f"bootstrap_official_https=PASS source={TWCA_INTERMEDIATE_URL}")
              print(f"bootstrap_fingerprint=PASS sha256={TWCA_INTERMEDIATE_SHA256}")
              print("bootstrap_subject_issuer_ca_validity_chain=PASS")
              print(f"temporary_bundle=PASS path={bundle.bundle_path}")

              endpoints = (
                  ("tpex_root", "GET", TPEX_BASE_URL, {}),
                  ("cbdaily_20260911", "GET", TPEX_REPORT_INDEX_URL, {
                      "params": {"date": "2026/09/11", "fileCode": TPEX_REPORT_CODE},
                  }),
                  ("bond_ISSBD5_data", "GET", TPEX_CB_ISSUE_URL, {}),
                  ("convSearch", "GET", TPEX_CB_LISTED_URL, {}),
                  ("convDelist", "GET", TPEX_CB_DELISTED_URL, {}),
                  ("announcement_openapi", "GET", "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap04_O", {}),
                  ("parent_stock", "POST", TPEX_DAILY_MARKET_URL, {
                      "data": {"date": "2026/09/11", "type": "EW", "response": "json"},
                  }),
              )
              for label, method, url, kwargs in endpoints:
                  response = session.request(method, url, timeout=30, **kwargs)
                  response.raise_for_status()
                  if label != "tpex_root":
                      response.json()
                  print(f"production_endpoint={label} PASS status={response.status_code}")

              captured = []
              original_request = requests.Session.request
              def capture(self, method, url, *args, **kwargs):
                  captured.append((url, kwargs.get("verify")))
                  return object()
              requests.Session.request = capture
              try:
                  session.get(f"https://{TPEX_HOST}/scope-test")
                  session.get("https://openapi.twse.com.tw/scope-test")
              finally:
                  requests.Session.request = original_request
              assert captured[0][1] == str(bundle.bundle_path)
              assert captured[1][1] is None
              print("scope_tpex_bundle=PASS")
              print("scope_non_tpex_default_trust=PASS")
              assert HTTP_TRANSIENT_MAX_ATTEMPTS == 3
              print("collector_transient_retry=PASS attempts=3 backoff=1s,2s")

              production_files = (
                  "tpex_tls.py", "collector.py", "master_collector.py",
                  "announcement_collector.py", "stock_collector.py",
              )
              forbidden = (
                  "verify=False", "CERT_NONE", "check_hostname = False",
                  "REQUESTS_CA_BUNDLE", "http://sslserver.twca.com.tw",
              )
              for filename in production_files:
                  source = open(filename, encoding="utf-8").read()
                  assert not any(value in source for value in forbidden), filename
              print("production_security_scan=PASS")
          finally:
              session.close()
          PY
