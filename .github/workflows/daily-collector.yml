name: CB Daily Collector

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb-history-db-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run TPEx CB collector
        id: collector
        shell: bash
        run: |
          set -o pipefail
          output="$(python collector.py --database data/cb_history.db)"
          printf '%s\n' "$output"

          trade_date="$(printf '%s\n' "$output" | sed -n 's/^trade_date: //p' | tail -n 1)"
          if [[ -n "$trade_date" && ! "$trade_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Collector returned an invalid trade_date: $trade_date" >&2
            exit 1
          fi
          echo "trade_date=$trade_date" >> "$GITHUB_OUTPUT"

      - name: Run CB master collector
        id: master
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python master_collector.py --database data/cb_history.db 2>&1 | tee phase2-modules.log
          exit "${PIPESTATUS[0]}"

      - name: Validate CB history database
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from datetime import datetime
          from zoneinfo import ZoneInfo

          run_date = datetime.now(ZoneInfo("Asia/Taipei")).date().isoformat()
          connection = sqlite3.connect("data/cb_history.db")
          try:
              integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"SQLite integrity_check failed: {integrity}")

              foreign_keys = connection.execute("PRAGMA foreign_key_check").fetchall()
              if foreign_keys:
                  raise SystemExit(f"SQLite foreign_key_check failed: {foreign_keys}")

              future_balances = connection.execute(
                  "SELECT cb_code, balance_date FROM cb_master "
                  "WHERE balance_date > ? ORDER BY cb_code",
                  (run_date,),
              ).fetchall()
              if future_balances:
                  raise SystemExit(
                      "Future balance_date rows: "
                      + ", ".join(f"{code}={balance_date}" for code, balance_date in future_balances)
                  )

              unfinished_months = connection.execute(
                  "SELECT cb_code, year_month FROM cb_monthly_balance "
                  "WHERE year_month >= ? ORDER BY cb_code",
                  (run_date[:7],),
              ).fetchall()
              if unfinished_months:
                  raise SystemExit(
                      "Unfinished monthly balance rows: "
                      + ", ".join(f"{code}={year_month}" for code, year_month in unfinished_months)
                  )
          finally:
              connection.close()

          print(f"SQLite validation passed for Asia/Taipei run date {run_date}")
          PY

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cb_history.db docs/data.json docs/index.html; then
            echo "Database and dashboard have no changes; nothing to commit."
            exit 0
          fi

          trade_date="${{ steps.collector.outputs.trade_date }}"
          if [[ -z "$trade_date" ]]; then
            echo "Database changed but collector did not report a trade_date." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb_history.db docs/data.json docs/index.html
          git commit -m "Update CB history $trade_date"
          git push origin HEAD:main

      - name: Report Phase 2 module status
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 2 module status"
            echo
            if [[ -f phase2-modules.log ]]; then
              grep '^phase2_module_' phase2-modules.log || true
            else
              echo "master collector did not start"
            fi
            echo
            echo "Master collector step outcome: ${{ steps.master.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
