name: CB Daily Collector

on:
  schedule:
    - cron: "10 11 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional single TPEx trade date for a narrow recovery (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cb-history-db-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore DB snapshot from manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readarray -t snapshot < <(python - <<'PY'
          import json
          data = json.load(open('data/cb_history.manifest.json', encoding='utf-8'))['snapshot']
          print(data['release_tag'])
          print(data['asset_name'])
          PY
          )
          mkdir -p .snapshot-download
          gh release download "${snapshot[0]}" --pattern "${snapshot[1]}" --dir .snapshot-download
          python scripts/restore_db_snapshot.py \
            --manifest data/cb_history.manifest.json \
            --asset ".snapshot-download/${snapshot[1]}" \
            --destination data/cb_history.db

      - name: Run TPEx CB collector
        id: collector
        shell: bash
        run: |
          set -o pipefail
          args=(--database data/cb_history.db)
          if [[ -n "${{ inputs.trade_date }}" ]]; then
            args+=(--date "${{ inputs.trade_date }}")
          fi
          output="$(python collector.py "${args[@]}")"
          printf '%s\n' "$output"

          trade_date="$(printf '%s\n' "$output" | sed -n 's/^trade_date: //p' | tail -n 1)"
          if [[ -n "$trade_date" && ! "$trade_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Collector returned an invalid trade_date: $trade_date" >&2
            exit 1
          fi
          echo "trade_date=$trade_date" >> "$GITHUB_OUTPUT"

      - name: Collect daily company announcements
        # This collector runs TWSE and TPEx independently.  It records every
        # failed attempt in announcement_fetch, retains any successful market,
        # then exits non-zero if either market ultimately fails.
        run: >
          python announcement_collector.py
          --db data/cb_history.db
          --market all

      - name: Run CB master collector
        id: master
        if: steps.collector.outputs.trade_date != ''
        shell: bash
        run: |
          set -o pipefail
          python master_collector.py --database data/cb_history.db --date "${{ steps.collector.outputs.trade_date }}" 2>&1 | tee phase2-modules.log
          exit "${PIPESTATUS[0]}"

      - name: Refresh strict daily CB parent mapping
        if: steps.collector.outputs.trade_date != ''
        run: >
          python master_collector.py
          --refresh-daily-parent-mapping
          --date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Verify strict daily CB parent mapping completeness
        if: steps.collector.outputs.trade_date != ''
        shell: bash
        run: |
          python - "${{ steps.collector.outputs.trade_date }}" <<'PY'
          import sqlite3
          import sys

          trade_date = sys.argv[1]
          connection = sqlite3.connect("data/cb_history.db")
          try:
              missing = connection.execute(
                  """
                  SELECT daily.cb_code
                  FROM cb_daily AS daily
                  LEFT JOIN cb_parent_stock_mapping AS mapping
                    ON mapping.cb_code = daily.cb_code
                   AND mapping.mapping_date = daily.trade_date
                  WHERE daily.trade_date = ? AND mapping.cb_code IS NULL
                  ORDER BY daily.cb_code
                  """,
                  (trade_date,),
              ).fetchall()
          finally:
              connection.close()
          if missing:
              raise SystemExit(
                  "Strict exact parent mapping incomplete: "
                  + ",".join(row[0] for row in missing)
              )
          print(f"Strict exact parent mapping complete for {trade_date}")

      - name: Run parent stock market collector
        if: steps.collector.outputs.trade_date != ''
        run: >
          python stock_collector.py
          --date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Run published Strategy A-v2 date
        if: steps.collector.outputs.trade_date != ''
        run: >
          python strategy_runs.py
          --run-published-date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Run strategy B-v1
        if: steps.collector.outputs.trade_date != ''
        continue-on-error: true
        run: >
          python strategy_b.py
          --date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Run strategy C-v1
        if: steps.collector.outputs.trade_date != ''
        continue-on-error: true
        run: >
          python strategy_c.py
          --date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Run strategy G-v1
        if: steps.collector.outputs.trade_date != ''
        continue-on-error: true
        run: >
          python strategy_g.py
          --date "${{ steps.collector.outputs.trade_date }}"
          --database data/cb_history.db

      - name: Validate CB history database
        run: python scripts/validate_db.py --database data/cb_history.db

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Publish verified DB snapshot candidate
        if: steps.collector.outputs.trade_date != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/publish_db_snapshot.py
          --candidate-db data/cb_history.db
          --trade-date "${{ steps.collector.outputs.trade_date }}"
          --manifest data/cb_history.manifest.json
          --manifest-output .snapshot-candidate-manifest.json
          --run-id "${{ github.run_id }}"
          --attempt "${{ github.run_attempt }}"

      - name: Install verified snapshot manifest
        if: steps.collector.outputs.trade_date != ''
        run: mv .snapshot-candidate-manifest.json data/cb_history.manifest.json

      - name: Commit and push updated data
        if: steps.collector.outputs.trade_date != ''
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cb_history.manifest.json docs/data.json docs/index.html; then
            echo "Snapshot manifest and dashboard have no changes; nothing to commit."
            exit 0
          fi

          trade_date="${{ steps.collector.outputs.trade_date }}"
          if [[ -z "$trade_date" ]]; then
            echo "Database changed but collector did not report a trade_date." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb_history.manifest.json docs/data.json docs/index.html
          git commit -m "Update CB history $trade_date"
          git push origin HEAD:main

      - name: Report Phase 2 module status
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 2 module status"
            echo
            if [[ -f phase2-modules.log ]]; then
              grep '^phase2_module_' phase2-modules.log || true
            else
              echo "master collector did not start"
            fi
            echo
            echo "Master collector step outcome: ${{ steps.master.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
