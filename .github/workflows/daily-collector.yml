name: CB Daily Collector

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb-daily-collector-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run TPEx CB collector
        id: collector
        shell: bash
        run: |
          set -o pipefail
          output="$(python collector.py)"
          printf '%s\n' "$output"

          trade_date="$(printf '%s\n' "$output" | sed -n 's/^trade_date: //p' | tail -n 1)"
          if [[ -n "$trade_date" && ! "$trade_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Collector returned an invalid trade_date: $trade_date" >&2
            exit 1
          fi
          echo "trade_date=$trade_date" >> "$GITHUB_OUTPUT"

      - name: Build dashboard data
        run: python scripts/build_dashboard.py

      - name: Commit and push updated data
        shell: bash
        run: |
          if git diff --quiet -- data/cb_history.db docs/data.json docs/index.html; then
            echo "Database and dashboard have no changes; nothing to commit."
            exit 0
          fi

          trade_date="${{ steps.collector.outputs.trade_date }}"
          if [[ -z "$trade_date" ]]; then
            echo "Database changed but collector did not report a trade_date." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cb_history.db docs/data.json docs/index.html
          git commit -m "Update CB history $trade_date"
          git push origin HEAD:main
